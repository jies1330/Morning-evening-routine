  /* ============================================================
     Fenêtres (verrou parents, confirmations, choix)
     ============================================================ */
  const Modal = { el: null, opts: null, last: null };
  function openModal(html, opts = {}) {
    closeModal(true);
    const wrap = document.createElement('div'); wrap.className = 'modal-wrap';
    wrap.innerHTML = typo(`<div class="modal ${opts.wide ? 'modal-wide' : ''}" role="dialog" aria-modal="true" tabindex="-1" style="${opts.style || ''}">${html}</div>`);
    document.body.appendChild(wrap);
    Modal.el = wrap; Modal.opts = opts; Modal.last = document.activeElement;
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target.closest('[data-close]')) { closeModal(); return; }
      if (opts.onClick) opts.onClick(e.target, e);
    });
    wrap.addEventListener('submit', (e) => { e.preventDefault(); if (opts.onSubmit) opts.onSubmit(e.target, e); });
    wrap.addEventListener('change', (e) => syncSwatches(e.target));
    setTimeout(() => { const f = wrap.querySelector('[autofocus]') || wrap.querySelector('.modal'); if (f && f.focus) f.focus(); }, 40);
  }
  function closeModal(silent) {
    if (!Modal.el) return;
    const o = Modal.opts; Modal.el.remove(); Modal.el = null; Modal.opts = null;
    if (!silent && o && o.onClose) o.onClose();
    try { if (Modal.last && document.contains(Modal.last)) Modal.last.focus(); } catch (e) { /* rien */ }
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Modal.el) closeModal(); });
  function confirmBox({ title, text, ok = 'Confirmer', danger = false }) {
    return new Promise((res) => {
      openModal(`<h2 class="modal-title">${esc(title)}</h2><p>${esc(text)}</p><div class="modal-actions"><button class="btn" data-close>Annuler</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok ${danger ? '' : 'autofocus'}>${esc(ok)}</button></div>`, {
        onClick: (t) => { if (t.closest('[data-ok]')) { res(true); closeModal(true); } },
        onClose: () => res(false),
      });
    });
  }
  function gate(then) {
    if (Date.now() < S.parentUntil) { then(); return; }
    let a = 0; let b = 0;
    const ask = () => { a = 3 + Math.floor(Math.random() * 7); b = 3 + Math.floor(Math.random() * 7); return `${a} × ${b} = ?`; };
    openModal(`<form class="gate" autocomplete="off"><h2 class="modal-title">${I.lock.replace('<svg', '<svg style="width:26px;height:26px;vertical-align:-3px;margin-right:6px"')}Espace parents</h2><p>Pour continuer, réponds à ce calcul :</p><p class="gate-q" id="gate-q">${ask()}</p><label class="sr-only" for="gate-answer">Réponse</label><input id="gate-answer" type="number" inputmode="numeric" autofocus><div class="modal-actions"><button type="button" class="btn" data-close>Annuler</button><button class="btn btn-primary" type="submit">Valider</button></div></form>`, {
      onSubmit: (form) => {
        const inp = form.querySelector('#gate-answer');
        if (+inp.value === a * b && inp.value !== '') { S.parentUntil = Date.now() + 5 * 60e3; closeModal(true); then(); return; }
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        form.querySelector('#gate-q').textContent = ask(); inp.value = ''; inp.focus();
      },
    });
  }
  function openPicker(current, onPick) {
    const kid = currentKid();
    openModal(`<h2 class="modal-title">Choisis l’animation</h2><div class="pick-grid">${P.ACTIVITIES.map((a) => `<button class="pick ${a.id === current ? 'is-on' : ''}" data-pick="${a.id}"><span class="medal pick-medal is-still">${P.render(a.id)}</span><span class="pick-name">${esc(a.name)}</span></button>`).join('')}</div><div class="modal-actions"><button class="btn" data-close>Annuler</button></div>`, {
      wide: true, style: colorVars(kid && kid.color),
      onClick: (t) => { const btn = t.closest('[data-pick]'); if (btn) { closeModal(true); onPick(btn.dataset.pick); } },
    });
  }
  function syncSwatches(input) {
    if (!input || input.name !== 'color') return;
    const group = input.closest('.swatches'); if (!group) return;
    group.querySelectorAll('.swatch').forEach((l) => l.classList.toggle('is-on', l.contains(input)));
  }
  function toast(msg) {
    const t = $('#toast'); if (!t) return;
    t.textContent = typo(msg); t.classList.add('is-on');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('is-on'), 3400);
  }

  /* ============================================================
     Actions
     ============================================================ */
  function seedExamples() {
    if (!S.data.routines.length) ['matin', 'soir'].forEach((k, i) => { const r = fromTemplate(k, i * 10); put('routines', r.id, r); });
    if (!S.data.rewards.length) DEFAULT_REWARDS.forEach((w, i) => put('rewards', uid(), { ...w, order: i * 10, example: true }));
  }
  function moveIn(list, i, dir) { const j = i + dir; if (j < 0 || j >= list.length) return false; const tmp = list[i]; list[i] = list[j]; list[j] = tmp; return true; }
  function redeem(id) {
    const w = S.data.rewards.find((x) => x.id === id); const kid = currentKid();
    if (!w || !kid || balance(kid.id) < w.cost) return;
    gate(async () => {
      const ok = await confirmBox({ title: `${w.emoji || '🎁'} ${w.name}`, text: `Échanger ${plural(w.cost, 'étoile')} de ${kid.name} contre cette récompense ?`, ok: 'Valider l’échange' });
      if (!ok) return;
      put('log', uid(), { child: kid.id, kind: 'reward', reward: w.id, title: w.name, emoji: w.emoji || '🎁', stars: -w.cost, at: Date.now() });
      Sound.play('fanfare'); confetti();
      openModal(`<div class="modal-center" style="display:grid;gap:12px;${colorVars(kid.color)}"><div class="medal modal-medal">${P.render('bravo')}</div><h2 class="modal-title">Récompense débloquée !</h2><p style="font-size:20px">${esc(w.emoji || '🎁')} ${esc(w.name)}</p><div class="modal-actions" style="justify-content:center"><button class="btn btn-primary btn-big" data-close autofocus>Super !</button></div></div>`);
      Voice.say(`Bravo ${kid.name} ! Récompense débloquée : ${w.name}`);
    });
  }
  function addChild() {
    if (S.data.children.length >= MAX_KIDS) { toast(`${MAX_KIDS} enfants maximum.`); return; }
    const free = Object.keys(P.COLORS).find((k) => !S.data.children.some((c) => c.color === k)) || 'corail';
    openModal(`<form class="form-card" style="padding:0" autocomplete="off"><h2 class="modal-title">Ajouter un enfant</h2><label for="k-name">Prénom</label><input id="k-name" class="field" maxlength="24" required autofocus><fieldset class="swatches"><legend>Couleur de son Pépin</legend>${swatchRadios(free)}</fieldset><div class="modal-actions"><button type="button" class="btn" data-close>Annuler</button><button class="btn btn-primary" type="submit">Ajouter</button></div></form>`, {
      onSubmit: (f) => {
        const name = f.querySelector('#k-name').value.trim(); if (!name) return;
        const sel = f.querySelector('input[name="color"]:checked'); const id = uid();
        put('children', id, { name, color: sel ? sel.value : free, order: nextOrder('children'), createdAt: Date.now() });
        closeModal(true); toast(`${name} a maintenant son Pépin !`);
      },
    });
  }
  function newRoutine() {
    const opts = [['vide', 'Routine vide', 'Tu ajoutes les étapes une par une.', 'etoile'], ...Object.entries(TEMPLATES).map(([k, t]) => [k, t.name, t.blurb, t.icon])];
    openModal(`<h2 class="modal-title">Nouvelle routine</h2><div class="tpl-grid">${opts.map(([k, n, b, icon]) => `<button class="tpl" data-tpl="${k}"><span class="rc-icon sm">${RI[icon]}</span><span><strong>${esc(n)}</strong><span>${esc(b)}</span></span></button>`).join('')}</div><div class="modal-actions"><button class="btn" data-close>Annuler</button></div>`, {
      onClick: (t) => {
        const b = t.closest('[data-tpl]'); if (!b) return;
        closeModal(true);
        const order = nextOrder('routines');
        const r = b.dataset.tpl === 'vide' ? { id: uid(), name: 'Nouvelle routine', icon: 'etoile', order, steps: [] } : { ...fromTemplate(b.dataset.tpl, order), example: false };
        put('routines', r.id, r); S.editId = r.id; go('editor');
      },
    });
  }
  async function wipeAll() {
    const ok = await confirmBox({ title: 'Tout effacer ?', text: S.mode === 'cloud' ? 'Routines, enfants, récompenses et étoiles seront supprimés pour de bon, pour toute la famille et sur tous les appareils.' : 'Routines, enfants, récompenses et étoiles seront supprimés pour de bon.', ok: 'Tout effacer', danger: true });
    if (!ok) return;
    S.run = null; clearRun(); S.childId = null; LS.del('pepin.child');
    const all = COLS.flatMap((col) => S.data[col].map((d) => [col, d.id]));
    COLS.forEach((col) => { S.data[col] = []; });
    go('welcome');
    toast('Tout a été effacé.');
    await Promise.all(all.map(([col, id]) => Promise.resolve().then(() => S.store.remove(col, id)).catch(() => { /* on continue */ })));
  }
  const stepIndex = (t) => +t.dataset.i;
  const ACTIONS = {
    parents: () => gate(() => go('parents')),
    home: () => go('home'),
    rewards: () => go('rewards'),
    kid: (t) => { S.childId = t.dataset.id; LS.set('pepin.child', S.childId); render(true); },
    start: (t) => startRun(t.dataset.id),
    try: (t) => startRun(t.dataset.id),
    pause: () => togglePause(),
    done: () => doneStep(),
    skip: () => skipStep(),
    quit: () => quitRun(),
    redeem: (t) => redeem(t.dataset.id),
    tab: (t) => { S.tab = t.dataset.tab; S.view = 'parents'; render(); },
    edit: (t) => { S.editId = t.dataset.id; go('editor'); },
    'r-new': () => newRoutine(),
    'r-up': (t) => reorderRoutine(t.dataset.id, -1),
    'r-down': (t) => reorderRoutine(t.dataset.id, 1),
    'r-dup': (t) => {
      const src = routineById(t.dataset.id); if (!src) return;
      const r = { ...clone(src), id: uid(), name: `${src.name} (copie)`.slice(0, 30), order: nextOrder('routines'), example: false };
      r.steps = (r.steps || []).map((s) => ({ ...s, id: uid() }));
      put('routines', r.id, r); toast('Routine dupliquée.');
    },
    'r-del': async (t) => {
      const r = routineById(t.dataset.id); if (!r) return;
      if (await confirmBox({ title: `Supprimer « ${r.name} » ?`, text: 'Cette routine et ses étapes seront supprimées.', ok: 'Supprimer', danger: true })) { del('routines', r.id); toast('Routine supprimée.'); }
    },
    'r-icon': (t) => mutateRoutine(S.editId, (r) => { r.icon = t.dataset.icon; }),
    'r-kid': (t) => {
      const r = routineById(S.editId); if (!r) return;
      const all = kids().map((k) => k.id); const id = t.dataset.id;
      let sel = Array.isArray(r.kids) && r.kids.length ? r.kids.filter((x) => all.includes(x)) : all.slice();
      if (sel.includes(id)) {
        if (sel.length === 1) { toast('Choisis au moins un enfant.'); return; }
        sel = sel.filter((x) => x !== id);
      } else sel.push(id);
      mutateRoutine(S.editId, (rr) => { rr.kids = sel.length >= all.length ? [] : sel; });
    },
    's-add': () => openPicker(null, (type) => mutateRoutine(S.editId, (r) => {
      const a = ACT[type]; const s = { id: uid(), type, label: a.label, sec: a.sec }; if (type === 'autre') s.emoji = '⭐'; r.steps.push(s);
    })),
    's-type': (t) => {
      const i = stepIndex(t); const r = routineById(S.editId); if (!r || !r.steps[i]) return;
      openPicker(r.steps[i].type, (type) => mutateRoutine(S.editId, (rr) => {
        const s = rr.steps[i]; if (!s) return;
        const wasDefault = !s.label || s.label === (ACT[s.type] || {}).label;
        s.type = type; if (wasDefault) s.label = ACT[type].label;
        if (type === 'autre' && !s.emoji) s.emoji = '⭐';
      }));
    },
    's-up': (t) => mutateRoutine(S.editId, (r) => moveIn(r.steps, stepIndex(t), -1)),
    's-down': (t) => mutateRoutine(S.editId, (r) => moveIn(r.steps, stepIndex(t), 1)),
    's-del': (t) => { const i = stepIndex(t); const r = routineById(S.editId); const s = r && r.steps[i]; if (!s) return; mutateRoutine(S.editId, (rr) => { rr.steps.splice(i, 1); }); toast(`Étape « ${s.label} » supprimée.`); },
    'c-add': () => addChild(),
    'c-color': (t) => { const k = kidById(t.dataset.id); if (k) put('children', k.id, { ...k, color: t.dataset.color }); },
    'c-plus': (t) => put('log', uid(), { child: t.dataset.id, kind: 'adjust', stars: 1, title: 'Ajustement', at: Date.now() }),
    'c-minus': (t) => { if (balance(t.dataset.id) > 0) put('log', uid(), { child: t.dataset.id, kind: 'adjust', stars: -1, title: 'Ajustement', at: Date.now() }); },
    'c-del': async (t) => {
      const k = kidById(t.dataset.id); if (!k) return;
      if (!(await confirmBox({ title: `Supprimer ${k.name} ?`, text: 'Son Pépin, ses étoiles et son historique seront supprimés.', ok: 'Supprimer', danger: true }))) return;
      del('children', k.id);
      S.data.routines.filter((r) => Array.isArray(r.kids) && r.kids.includes(k.id)).forEach((r) => put('routines', r.id, { ...r, kids: r.kids.filter((x) => x !== k.id) }));
      S.data.log.filter((e) => e.child === k.id).forEach((e) => del('log', e.id));
      if (S.data.balances.some((b) => b.id === k.id)) del('balances', k.id);
      if (S.childId === k.id) { S.childId = (kids()[0] || {}).id || null; LS.set('pepin.child', S.childId || ''); }
      if (!S.data.children.length) go('welcome');
    },
    'w-add': () => put('rewards', uid(), { emoji: '🎁', name: 'Nouvelle récompense', cost: 10, order: nextOrder('rewards') }),
    'w-del': async (t) => {
      const w = S.data.rewards.find((x) => x.id === t.dataset.id); if (!w) return;
      if (await confirmBox({ title: `Supprimer « ${w.name} » ?`, text: 'Les enfants ne la verront plus.', ok: 'Supprimer', danger: true })) del('rewards', w.id);
    },
    wipe: () => wipeAll(),
    'copy-code': async () => {
      const code = S.account && (S.account.familyCode || S.account.familyId); if (!code) return;
      try { await navigator.clipboard.writeText(code); toast('Code famille copié.'); } catch (e) { toast(`Code famille : ${code}`); }
    },
    signout: async () => {
      if (!S.account) return;
      if (await confirmBox({ title: 'Se déconnecter ?', text: 'Les données restent dans ta famille. Il faudra se reconnecter sur cet appareil.', ok: 'Se déconnecter' })) S.account.signOut();
    },
    export: () => exportData(),
    install: async () => { const H = window.PepinHost; if (H && H.install && await H.install()) toast('Pépin est installé : retrouve son icône sur l’écran d’accueil.'); render(true); },
    music: (t) => {
      const on = !settings().music;
      put('settings', 'app', { ...settings(), music: on });
      t.outerHTML = musicBtn(); Music.sync();
    },
  };
  function exportData() {
    const data = {}; COLS.forEach((c) => { data[c] = S.data[c].map((d) => ({ ...d })); });
    const payload = { app: 'pepin', version: 1, exportedAt: new Date().toISOString(), data };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `pepin-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast('Sauvegarde exportée.');
    } catch (e) { toast('Export impossible sur cet appareil.'); }
  }
  async function importData(file) {
    let payload = null;
    try { payload = JSON.parse(await file.text()); } catch (e) { toast('Ce fichier est illisible.'); return; }
    const data = payload && payload.app === 'pepin' && payload.data;
    if (!data || typeof data !== 'object') { toast('Ce fichier n’est pas une sauvegarde de Pépin.'); return; }
    const okId = (id) => typeof id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id);
    const items = COLS.flatMap((c) => (Array.isArray(data[c]) ? data[c] : []).filter((d) => d && typeof d === 'object' && okId(d.id)).map((d) => [c, d]));
    const n = (c) => items.filter(([cc]) => cc === c).length;
    const ok = await confirmBox({ title: 'Importer cette sauvegarde ?', text: `${plural(n('children'), 'enfant')}, ${plural(n('routines'), 'routine')}, ${plural(n('rewards'), 'récompense')} et l’historique des étoiles. Les éléments déjà présents avec le même identifiant seront remplacés.`, ok: 'Importer' });
    if (!ok) return;
    items.forEach(([c, d]) => put(c, d.id, d));
    if (!kidById(S.childId)) { const k = kids()[0]; S.childId = k ? k.id : null; if (S.childId) LS.set('pepin.child', S.childId); }
    toast('Sauvegarde importée.');
    if (S.view === 'welcome' && kids().length) go('home');
  }
  function reorderRoutine(id, dir) {
    const list = routines(); const i = list.findIndex((r) => r.id === id);
    if (!moveIn(list, i, dir)) return;
    list.forEach((r, k) => { if ((r.order || 0) !== k * 10) put('routines', r.id, { ...r, order: k * 10 }); });
  }
  const CHANGES = {
    'r-name': (el) => mutateRoutine(S.editId, (r) => { r.name = el.value.trim().slice(0, 30) || 'Routine'; }),
    's-label': (el) => mutateRoutine(S.editId, (r) => { const s = r.steps[stepIndex(el)]; if (s) s.label = el.value.trim().slice(0, 40) || (ACT[s.type] || ACT.autre).label; }),
    's-dur': (el) => mutateRoutine(S.editId, (r) => { const s = r.steps[stepIndex(el)]; if (s) s.sec = Math.max(10, +el.value || 60); }),
    's-emoji': (el) => mutateRoutine(S.editId, (r) => { const s = r.steps[stepIndex(el)]; if (s) s.emoji = el.value.trim().slice(0, 8) || '⭐'; }),
    'c-name': (el) => { const k = kidById(el.dataset.id); const v = el.value.trim().slice(0, 24); if (k && v) put('children', k.id, { ...k, name: v }); },
    'w-emoji': (el) => { const w = S.data.rewards.find((x) => x.id === el.dataset.id); if (w) put('rewards', w.id, { ...w, emoji: el.value.trim().slice(0, 8) || '🎁', example: false }); },
    'w-name': (el) => { const w = S.data.rewards.find((x) => x.id === el.dataset.id); const v = el.value.trim().slice(0, 40); if (w && v) put('rewards', w.id, { ...w, name: v, example: false }); },
    'w-cost': (el) => { const w = S.data.rewards.find((x) => x.id === el.dataset.id); const v = Math.min(999, Math.max(1, Math.round(+el.value || 1))); if (w) put('rewards', w.id, { ...w, cost: v, example: false }); },
    set: (el) => { put('settings', 'app', { ...settings(), [el.dataset.key]: el.checked }); Music.sync(); },
    import: (el) => { const f = el.files && el.files[0]; el.value = ''; if (f) importData(f); },
  };
  const FORMS = {
    welcome: (f) => {
      const inp = f.querySelector('#w-name'); const name = inp.value.trim();
      if (!name) { inp.focus(); return; }
      const sel = f.querySelector('input[name="color"]:checked'); const id = uid();
      put('children', id, { name: name.slice(0, 24), color: sel ? sel.value : 'corail', order: nextOrder('children'), createdAt: Date.now() });
      const seed = f.querySelector('#w-tpl'); if (seed && seed.checked) seedExamples();
      if (!S.data.settings.some((d) => d.id === 'app')) put('settings', 'app', { ...DEFAULT_SETTINGS });
      S.childId = id; LS.set('pepin.child', id); Sound.unlock(); go('home');
    },
  };

  const inApp = (el) => { const app = $('#app'); return !!(el && app && app.contains(el)); };
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]'); if (!t || !inApp(t) || t.disabled) return;
    const fn = ACTIONS[t.dataset.action]; if (!fn) return;
    e.preventDefault(); fn(t, e);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (inApp(t) && t.name === 'color') {
      syncSwatches(t);
      if (t.closest('#welcome')) { S.draftColor = t.value; const w = $('#welcome'); if (w) w.setAttribute('style', colorVars(t.value)); }
      return;
    }
    const c = t.closest && t.closest('[data-change]'); if (!c || !inApp(c)) return;
    const fn = CHANGES[c.dataset.change]; if (fn) fn(c, e);
  });
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form]'); if (!f || !inApp(f)) return;
    e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f);
  });
  document.addEventListener('toggle', (e) => {
    const d = e.target; if (!d || !d.dataset || !d.dataset.hist) return;
    if (d.open) S.openHist.add(d.dataset.hist); else S.openHist.delete(d.dataset.hist);
  }, true);

  /* ============================================================
     Démarrage
     ============================================================ */
  async function pickStore() {
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      try {
        const db = await c.use('db');
        if (db) {
          let canWrite = null;
          try { const u = await c.use('user'); canWrite = u ? await u.can('data.write') : null; } catch (e) { canWrite = null; }
          if (canWrite !== false) return { store: new RemoteStore(db), mode: 'sync' };
        }
      } catch (e) { console.warn('[pepin] base indisponible, enregistrement local', e); }
    }
    return { store: new LocalStore(LKEY), mode: 'local' };
  }
  function subscribe() {
    S.unsubs.forEach((u) => { try { u(); } catch (e) { /* déjà fermé */ } });
    S.unsubs = []; S.got = new Set();
    COLS.forEach((col) => { S.unsubs.push(S.store.watch(col, (list) => onData(col, list), (err) => onWatchError(col, err))); });
    clearTimeout(S.readyTimer);
    S.readyTimer = setTimeout(() => { if (!S.ready) becomeReady(); }, 9000);
  }
  function onData(col, list) {
    S.data[col] = list; S.got.add(col);
    if (!S.ready) { if (S.got.size === COLS.length) becomeReady(); return; }
    /* données arrivées après le délai d'attente (réseau lent) : on quitte l'écran de bienvenue */
    if (col === 'children' && S.view === 'welcome' && kids().length) {
      if (!kidById(S.childId)) S.childId = kids()[0].id;
      S.view = 'home'; render(); return;
    }
    scheduleRender();
  }
  function onWatchError(col, err) {
    console.warn('[pepin] synchronisation', col, err);
    if (!S.ready && S.mode === 'sync') { S.store = new LocalStore(LKEY); S.mode = 'local'; subscribe(); return; }
    const i = COLS.indexOf(col);
    if (err && (err.code === 'unavailable' || (S.mode === 'cloud' && err.code === 'permission-denied')) && !(S.retried || {})[col]) {
      S.retried = { ...(S.retried || {}), [col]: true };
      setTimeout(() => { S.unsubs[i] = S.store.watch(col, (l) => onData(col, l), (e) => onWatchError(col, e)); }, 1500);
      return;
    }
    if (err && err.code === 'permission-denied') { toast('Accès refusé par Firebase : vérifie les règles de sécurité (guide, étape 1.4).'); return; }
    toast('La synchronisation s’est arrêtée. Recharge la page pour la relancer.');
  }
  function becomeReady() {
    S.ready = true; clearTimeout(S.readyTimer);
    const ks = kids(); const saved = LS.get('pepin.child');
    if (!kidById(S.childId)) S.childId = ((ks.find((k) => k.id === saved) || ks[0]) || {}).id || null;
    if (S.run && kidById(S.run.childId)) S.view = 'run';
    else {
      S.run = null; clearRun();
      const hv = S.hotView;
      S.view = ks.length ? (['home', 'rewards', 'parents', 'editor'].includes(hv) ? hv : 'home') : 'welcome';
    }
    render();
    if (S.view === 'run' && S.run && S.run.pausedAt == null) Wake.on();
    compact().catch(() => {});
  }
  /* Regroupe les entrées de plus de 60 jours dans un solde par enfant (garde la base légère). */
  async function compact() {
    const last = +(LS.get('pepin.compact') || 0);
    if (Date.now() - last < 864e5) return;
    LS.set('pepin.compact', String(Date.now()));
    const cutoff = Date.now() - 60 * 864e5;
    for (const k of S.data.children) {
      if (!S.data.log.some((e) => e.child === k.id && (+e.at || 0) < cutoff)) continue;
      if (!(await S.store.lease('balances', k.id, S.tabId))) continue;
      const fresh = (await S.store.get('balances', k.id)) || { stars: 0, upTo: 0 };
      const upTo = +fresh.upTo || 0;
      const old = S.data.log.filter((e) => e.child === k.id && (+e.at || 0) < cutoff);
      const add = old.filter((e) => (+e.at || 0) >= upTo).reduce((s, e) => s + (+e.stars || 0), 0);
      await S.store.set('balances', k.id, { stars: (+fresh.stars || 0) + add, upTo: Math.max(upTo, cutoff) });
      for (const e of old) { try { await S.store.remove('log', e.id); } catch (err) { /* nettoyé plus tard */ } }
    }
  }

  function boot(hot, opts) {
    hot = hot || {}; opts = opts || {};
    if (!document.querySelector('.pp-defs')) document.body.insertAdjacentHTML('afterbegin', P.DEFS);
    const st = document.createElement('style'); st.textContent = P.arcCSS(); document.head.appendChild(st);
    Voice.init();
    S.run = hot.run || loadRun();
    if (hot.view) S.hotView = hot.view;
    if (hot.childId) S.childId = hot.childId;
    if (hot.tab) S.tab = hot.tab;
    if (hot.editId) S.editId = hot.editId;
    if (hot.parentUntil) S.parentUntil = hot.parentUntil;
    render();
    if (opts.store) { S.store = opts.store; S.mode = opts.mode || 'cloud'; S.account = opts.account || null; subscribe(); return; }
    pickStore().then(({ store, mode }) => { S.store = store; S.mode = mode; subscribe(); });
  }

  const hot = window.claude && window.claude.hot;
  try {
    if (hot && typeof hot.snapshot === 'function') {
      hot.snapshot(() => ({ run: S.run ? { ...S.run, seen: Date.now() } : null, view: S.view, childId: S.childId, tab: S.tab, editId: S.editId, parentUntil: S.parentUntil }));
    }
  } catch (e) { /* pas de rechargement à chaud */ }
  const start = (data) => boot(data || {});
  window.PepinApp = { start: (opts) => boot({}, opts) };
  if (window.PepinHost) { /* la version installable démarre l'app après la connexion */ }
  else if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>
<script>
/* ============================================================
   Pépin — version installable (GitHub Pages + Firebase)
   Connexion par e-mail, famille partagée entre parents,
   synchronisation Firestore avec cache hors ligne.
   ============================================================ */
(function () {
  'use strict';

  const P = window.Pepin;
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* stockage indisponible */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* stockage indisponible */ } },
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const typo = (h) => h.replace(/ ([!?:;»])/g, ' $1').replace(/« /g, '« ');
  const colorVars = (c) => { const k = P.COLORS[c] || P.COLORS.corail; return `--pp-body:${k.body};--pp-dark:${k.dark};--pp-belly:${k.belly}`; };

  const LKEY = 'pepin.data.v1';
  const LOCAL_FLAG = 'pepin.host.local';
  const famKey = (uid) => `pepin.family.${uid}`;
  const COLS = ['routines', 'children', 'rewards', 'log', 'balances', 'settings'];
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const okId = (id) => typeof id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id) && id !== '.' && id !== '..';

  let auth = null; let db = null; let user = null; let started = false;
  const ui = { screen: 'loading', tab: 'in', busy: false, msg: '', ok: false, text: '', email: '' };

  /* ---------- configuration (firebase-config.js) ---------- */
  const valid = (c) => !!(c && typeof c === 'object' && c.apiKey && c.projectId && c.appId && !/COLLE/i.test(`${c.apiKey}${c.projectId}${c.appId}`));
  function fromText(txt) {
    const get = (k) => { const m = new RegExp(`${k}\\s*:\\s*["'\`]([^"'\`]+)["'\`]`).exec(txt || ''); return m ? m[1].trim() : ''; };
    const c = {}; ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'].forEach((k) => { c[k] = get(k); });
    return c;
  }
  async function readConfig() {
    let c = null;
    try { /* global firebaseConfig */ if (typeof firebaseConfig !== 'undefined') c = firebaseConfig; } catch (e) { c = null; }
    if (!valid(c) && window.PEPIN_FIREBASE_CONFIG) c = window.PEPIN_FIREBASE_CONFIG;
    if (valid(c)) return c;
    try {
      /* Bloc collé tel quel (avec les lignes « import ») : on relit le texte du fichier. */
      const r = await fetch('firebase-config.js', { cache: 'no-cache' });
      if (r.ok) { const t = fromText(await r.text()); if (valid(t)) return t; }
    } catch (e) { /* hors ligne */ }
    return null;
  }

  /* ---------- stockage Firestore : families/{famille}/{collection}/{id} ---------- */
  class FirebaseStore {
    constructor(fdb, fid) { this.db = fdb; this.fid = fid; }
    ref(col, id) { return FB.doc(this.db, 'families', this.fid, col, id); }
    watch(col, cb, onErr) {
      return FB.onSnapshot(FB.collection(this.db, 'families', this.fid, col),
        (snap) => cb(snap.docs.map((d) => ({ ...d.data(), id: d.id }))),
        (e) => onErr && onErr({ code: e && e.code, message: e && e.message }));
    }
    async get(col, id) { const s = await FB.getDoc(this.ref(col, id)); return s.exists() ? { ...s.data(), id: s.id } : null; }
    set(col, id, body) { return FB.setDoc(this.ref(col, id), JSON.parse(JSON.stringify(body))); }
    remove(col, id) { return FB.deleteDoc(this.ref(col, id)); }
    async lease(col, id, holder) {
      const ref = FB.doc(this.db, 'families', this.fid, 'locks', `${col}-${id}`);
      try {
        return await withTimeout(FB.runTransaction(this.db, async (tx) => {
          const s = await tx.get(ref); const now = Date.now(); const cur = s.exists() ? s.data() : null;
          if (cur && cur.holder !== holder && (+cur.until || 0) > now) return false;
          tx.set(ref, { holder, until: now + 30000 });
          return true;
        }), 10000);
      } catch (e) { return false; }
    }
  }

  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
  function newCode() {
    const a = new Uint8Array(12); crypto.getRandomValues(a);
    return Array.from(a, (x) => ALPHA[x % ALPHA.length]).join('');
  }
  const normCode = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const fmtCode = (c) => String(c).replace(/(.{4})(?=.)/g, '$1-');

  function errText(e, ctx) {
    const c = String((e && e.code) || '').replace(/^(auth|firestore)\//, '');
    const unknownCode = 'Code famille inconnu. Vérifie-le dans les Réglages de l’autre parent.';
    const M = {
      'invalid-email': 'Cette adresse e-mail n’est pas valide.',
      'missing-email': 'Tape ton adresse e-mail.',
      'invalid-credential': 'E-mail ou mot de passe incorrect.',
      'invalid-login-credentials': 'E-mail ou mot de passe incorrect.',
      'wrong-password': 'E-mail ou mot de passe incorrect.',
      'user-not-found': 'E-mail ou mot de passe incorrect.',
      'missing-password': 'Tape ton mot de passe.',
      'email-already-in-use': 'Un compte existe déjà avec cette adresse : choisis « J’ai un compte ».',
      'weak-password': 'Mot de passe trop court : 6 caractères minimum.',
      'password-does-not-meet-requirements': 'Ce mot de passe ne respecte pas les règles du projet Firebase.',
      'user-disabled': 'Ce compte a été désactivé.',
      'too-many-requests': 'Trop d’essais. Patiente quelques minutes puis réessaie.',
      'network-request-failed': 'Pas de connexion internet. Réessaie quand tu es connecté.',
      'operation-not-allowed': 'La connexion par e-mail n’est pas activée dans Firebase (guide, étape 1.2).',
      'configuration-not-found': 'Authentication n’est pas encore activé dans Firebase (guide, étape 1.2).',
      'admin-restricted-operation': 'La création de compte est bloquée dans Firebase (guide, étape 1.2).',
      'unauthorized-domain': 'Ce site n’est pas autorisé dans Firebase (guide, « En cas de souci »).',
      'invalid-api-key': 'La clé apiKey de firebase-config.js est incorrecte (guide, étape 2.4).',
      'api-key-not-valid.-please-pass-a-valid-api-key.': 'La clé apiKey de firebase-config.js est incorrecte (guide, étape 2.4).',
      timeout: 'Le serveur ne répond pas. Vérifie ta connexion internet puis réessaie.',
      unavailable: 'Pas de connexion internet. Réessaie quand tu es connecté.',
      'permission-denied': ctx === 'join' ? unknownCode : 'Accès refusé par Firestore : vérifie les règles de sécurité (guide, étape 1.4).',
      'not-found': ctx === 'join' ? unknownCode : 'La base Firestore n’existe pas encore (guide, étape 1.3).',
    };
    return M[c] || `Erreur : ${c || (e && e.message) || 'inconnue'}`;
  }

  /* ---------- écrans ---------- */
  const head = (title, lead) => `<div class="welcome-head"><div class="medal welcome-medal">${P.render('hello')}</div><h1 class="display">${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}</div>`;
  const status = () => `<p class="auth-error${ui.ok ? ' ok' : ''}" role="status" aria-live="polite">${esc(ui.msg)}</p>`;

  function localSummary() {
    let d = null; try { d = JSON.parse(LS.get(LKEY) || 'null'); } catch (e) { d = null; }
    const n = (c) => Object.keys((d && d[c]) || {}).length;
    if (!d || !n('children')) return '';
    const p = (k, w) => `${k} ${w}${k > 1 ? 's' : ''}`;
    return `${p(n('children'), 'enfant')}, ${p(n('routines'), 'routine')}`;
  }

  const VIEWS = {
    loading: () => `<section class="view center-view" style="${colorVars('corail')}"><div class="medal load-medal">${P.render('idle')}</div><p class="lead">${esc(ui.text || 'Chargement…')}</p></section>`,
    setup: () => `<section class="view welcome auth" style="${colorVars('corail')}">${head('Presque prêt !', 'Il reste à relier l’app à ton projet Firebase : colle ta configuration dans le fichier firebase-config.js (guide, étape 2.4).')}
      <div class="card form-card auth-card"><p class="auth-small">En attendant, tu peux essayer l’app sans compte : les données restent alors sur cet appareil.</p>
      ${status()}<button class="btn btn-primary btn-big" data-host="local">Essayer sans compte</button></div></section>`,
    signin: () => {
      const up = ui.tab === 'up';
      return `<section class="view welcome auth" style="${colorVars('corail')}">${head('Les routines de Pépin', 'Connecte-toi pour retrouver les routines et les étoiles sur tous tes appareils, Android comme iPhone.')}
      <form class="card form-card auth-card" data-host-form="auth" novalidate>
        <div class="seg" role="group" aria-label="Type de connexion">
          <button type="button" aria-pressed="${!up}" data-host="tab-in">J’ai un compte</button>
          <button type="button" aria-pressed="${up}" data-host="tab-up">Créer un compte</button>
        </div>
        <label for="a-email">Adresse e-mail</label>
        <input id="a-email" class="field" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(ui.email)}">
        <label for="a-pass">Mot de passe${up ? ' (6 caractères minimum)' : ''}</label>
        <div class="pw-wrap"><input id="a-pass" class="field" type="password" name="password" autocomplete="${up ? 'new-password' : 'current-password'}"><button type="button" class="pw-toggle" data-host="pw" aria-controls="a-pass" aria-pressed="false">Afficher</button></div>
        ${status()}
        <button class="btn btn-primary btn-big" type="submit" ${ui.busy ? 'disabled' : ''}>${up ? 'Créer mon compte' : 'Se connecter'}</button>
        ${up ? '<p class="auth-small">Chaque parent peut avoir son propre compte : vous partagerez ensuite la même famille grâce au code famille.</p>' : '<button type="button" class="link-btn" data-host="reset">Mot de passe oublié ?</button>'}
      </form></section>`;
    },
    family: () => {
      const loc = localSummary();
      return `<section class="view welcome auth" style="${colorVars('corail')}">${head('Ta famille', `Connecté : ${esc((user && user.email) || '')}. Crée ta famille, ou rejoins celle de l’autre parent avec son code.`)}
      ${status()}
      <div class="card form-card auth-card"><h3>Nouvelle famille</h3><p class="auth-small">Pour le premier parent. Tu obtiendras un code famille à donner à l’autre parent.</p>
        ${loc ? `<label class="check-row"><input type="checkbox" id="f-local" checked> Reprendre les données déjà sur cet appareil (${esc(loc)})</label>` : ''}
        <button class="btn btn-primary btn-big" data-host="create" ${ui.busy ? 'disabled' : ''}>Créer ma famille</button></div>
      <form class="card form-card auth-card" data-host-form="join" autocomplete="off" novalidate><h3>Rejoindre une famille</h3>
        <label for="f-code">Code famille (Réglages de l’app, chez l’autre parent)</label>
        <input id="f-code" class="field code-input" name="code" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD-EFGH-JKLM" maxlength="20">
        <button class="btn btn-big" type="submit" ${ui.busy ? 'disabled' : ''}>Rejoindre</button></form>
      <button class="link-btn" data-host="signout">Se déconnecter</button></section>`;
    },
    error: () => `<section class="view center-view auth" style="${colorVars('corail')}"><div class="medal load-medal">${P.render('idle')}</div>${status()}
      <button class="btn btn-primary" data-host="retry">Réessayer</button><button class="link-btn" data-host="signout">Se déconnecter</button></section>`,
  };

  function show(screen, o) {
    o = o || {};
    ui.screen = screen; ui.msg = o.msg || ''; ui.ok = !!o.ok; ui.text = o.text || ''; ui.busy = false;
    render();
  }
  function render() {
    const el = document.getElementById('app'); if (!el || started) return;
    const email = document.getElementById('a-email'); if (email) ui.email = email.value;
    el.dataset.view = 'auth';
    el.innerHTML = typo((VIEWS[ui.screen] || VIEWS.loading)());
  }
  function setMsg(msg, ok) {
    ui.msg = msg; ui.ok = !!ok;
    const n = document.querySelector('#app .auth-error');
    if (n) { n.textContent = typo(msg); n.classList.toggle('ok', !!ok); } else render();
  }
  function setBusy(b) {
    ui.busy = b;
    document.querySelectorAll('#app [data-host="create"], #app [data-host-form] [type="submit"]').forEach((x) => { x.disabled = b; });
  }

  /* ---------- démarrage de l'app ---------- */
  function startLocal() { if (started) return; started = true; window.PepinApp.start({}); }
  function startCloud(fid) {
    if (started) return; started = true;
    window.PepinApp.start({
      store: new FirebaseStore(db, fid), mode: 'cloud',
      account: { email: (user && user.email) || '', familyId: fid, familyCode: fmtCode(fid), signOut },
    });
  }
  async function signOut() {
    if (user) LS.del(famKey(user.uid));
    try { await FB.signOut(auth); } catch (e) { /* déjà déconnecté */ }
    location.reload();
  }

  async function onUser(u) {
    if (started) { if (!u || (user && u.uid !== user.uid)) location.reload(); return; }
    user = u;
    if (!u) { show('signin'); return; }
    const cached = LS.get(famKey(u.uid));
    if (cached) { startCloud(cached); return; }
    show('loading', { text: 'Recherche de ta famille…' });
    try {
      const snap = await withTimeout(FB.getDoc(FB.doc(db, 'users', u.uid)), 15000);
      const fid = snap.exists() ? (snap.data() || {}).family : null;
      if (fid && okId(fid)) { LS.set(famKey(u.uid), fid); startCloud(fid); } else show('family');
    } catch (e) { console.warn('[pepin] famille', e); show('error', { msg: errText(e, 'lookup') }); }
  }

  async function copyLocal(fid) {
    let d = null; try { d = JSON.parse(LS.get(LKEY) || 'null'); } catch (e) { d = null; }
    if (!d) return;
    COLS.forEach((col) => Object.entries(d[col] || {}).forEach(([id, body]) => {
      if (!okId(id) || !body || typeof body !== 'object') return;
      const b = JSON.parse(JSON.stringify(body)); delete b.id;
      FB.setDoc(FB.doc(db, 'families', fid, col, id), b).catch((e) => console.warn('[pepin] copie', col, id, e));
    }));
  }
  async function createFamily() {
    const withLocal = !!(document.getElementById('f-local') || {}).checked;
    setBusy(true); setMsg('Création de ta famille…', true);
    try {
      const fid = newCode();
      await withTimeout(FB.setDoc(FB.doc(db, 'families', fid), { members: [user.uid], createdAt: Date.now() }), 20000);
      await withTimeout(FB.setDoc(FB.doc(db, 'users', user.uid), { family: fid }), 20000);
      if (withLocal) await copyLocal(fid);
      LS.set(famKey(user.uid), fid);
      startCloud(fid);
    } catch (e) { console.warn('[pepin] création', e); setBusy(false); setMsg(errText(e, 'create')); }
  }
  async function joinFamily(raw) {
    const fid = normCode(raw);
    if (fid.length !== 12) { setMsg('Le code famille compte 12 lettres et chiffres, par exemple ABCD-EFGH-JKLM.'); return; }
    setBusy(true); setMsg('Connexion à la famille…', true);
    try {
      await withTimeout(FB.updateDoc(FB.doc(db, 'families', fid), { members: FB.arrayUnion(user.uid) }), 20000);
      await withTimeout(FB.setDoc(FB.doc(db, 'users', user.uid), { family: fid }), 20000);
      LS.set(famKey(user.uid), fid);
      startCloud(fid);
    } catch (e) { console.warn('[pepin] rejoindre', e); setBusy(false); setMsg(errText(e, 'join')); }
  }
  async function submitAuth(form) {
    const email = form.email.value.trim(); const pass = form.password.value;
    ui.email = email;
    if (!email) { setMsg('Tape ton adresse e-mail.'); form.email.focus(); return; }
    if (!pass) { setMsg('Tape ton mot de passe.'); form.password.focus(); return; }
    if (ui.tab === 'up' && pass.length < 6) { setMsg('Mot de passe trop court : 6 caractères minimum.'); form.password.focus(); return; }
    setBusy(true); setMsg(ui.tab === 'up' ? 'Création du compte…' : 'Connexion…', true);
    try {
      if (ui.tab === 'up') await FB.createUserWithEmailAndPassword(auth, email, pass);
      else await FB.signInWithEmailAndPassword(auth, email, pass);
      /* la suite se passe dans onAuthStateChanged */
    } catch (e) { console.warn('[pepin] connexion', e); setBusy(false); setMsg(errText(e, 'auth')); }
  }
  async function resetPassword() {
    const f = document.querySelector('#app [data-host-form="auth"]');
    const email = f ? f.email.value.trim() : '';
    if (!email) { setMsg('Tape d’abord ton adresse e-mail ci-dessus, puis touche « Mot de passe oublié ? ».'); if (f) f.email.focus(); return; }
    setMsg('Envoi de l’e-mail…', true);
    try {
      await FB.sendPasswordResetEmail(auth, email);
      setMsg('Si un compte existe pour cette adresse, un e-mail pour choisir un nouveau mot de passe vient d’être envoyé (pense aux spams).', true);
    } catch (e) { setMsg(errText(e, 'reset')); }
  }

  const HOST_ACTIONS = {
    local: () => { LS.set(LOCAL_FLAG, '1'); startLocal(); },
    'tab-in': () => { if (ui.tab !== 'in') { ui.tab = 'in'; ui.msg = ''; render(); } },
    'tab-up': () => { if (ui.tab !== 'up') { ui.tab = 'up'; ui.msg = ''; render(); } },
    pw: (b) => {
      const i = document.getElementById('a-pass'); if (!i) return;
      const vis = i.type === 'password'; i.type = vis ? 'text' : 'password';
      b.textContent = vis ? 'Masquer' : 'Afficher'; b.setAttribute('aria-pressed', String(vis));
    },
    reset: () => resetPassword(),
    create: () => createFamily(),
    signout: () => signOut(),
    retry: () => onUser(user),
  };
  document.addEventListener('click', (e) => {
    if (started) return;
    const b = e.target.closest && e.target.closest('#app [data-host]'); if (!b || b.disabled) return;
    const fn = HOST_ACTIONS[b.dataset.host]; if (!fn) return;
    e.preventDefault(); fn(b);
  });
  document.addEventListener('submit', (e) => {
    if (started) return;
    const f = e.target.closest && e.target.closest('#app [data-host-form]'); if (!f) return;
    e.preventDefault(); if (ui.busy) return;
    if (f.dataset.hostForm === 'auth') submitAuth(f);
    else if (f.dataset.hostForm === 'join') joinFamily(f.code.value);
  });

  /* ---------- installation (Android / ordinateur) ---------- */
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; });
  window.addEventListener('appinstalled', () => { installEvt = null; });
  window.PepinHost = {
    Store: FirebaseStore,
    canInstall: () => !!installEvt,
    install: async () => { if (!installEvt) return false; const e = installEvt; installEvt = null; e.prompt(); try { const r = await e.userChoice; return r && r.outcome === 'accepted'; } catch (err) { return false; } },
  };

  /* ---------- lancement ---------- */
  async function init() {
    if (!document.querySelector('.pp-defs')) document.body.insertAdjacentHTML('afterbegin', P.DEFS);
    show('loading');
    const cfg = await readConfig();
    if (!cfg || !window.FB) { if (LS.get(LOCAL_FLAG) === '1') startLocal(); else show('setup'); return; }
    try {
      const app = FB.initializeApp(cfg);
      auth = FB.getAuth(app); auth.languageCode = 'fr';
      try { db = FB.initializeFirestore(app, { localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }) }); }
      catch (e) { console.warn('[pepin] cache hors ligne indisponible', e); db = FB.initializeFirestore(app, {}); }
    } catch (e) {
      console.error('[pepin] configuration', e);
      show('setup', { msg: `La configuration Firebase est invalide (${(e && (e.code || e.message)) || 'erreur'}). Recopie le bloc firebaseConfig (guide, étape 2.4).` });
      return;
    }
    FB.onAuthStateChanged(auth, onUser, (e) => { console.warn('[pepin] auth', e); show('signin', { msg: errText(e, 'auth') }); });
  }

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[pepin] service worker', e)); });
  }
  init();
})();

</script>
</body>
</html>
