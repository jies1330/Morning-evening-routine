<style>
@font-face{font-family:'Grandstander';font-style:normal;font-weight:700;font-display:swap;src:url('grandstander-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Grandstander';font-style:normal;font-weight:800;font-display:swap;src:url('grandstander-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'Grandstander';font-style:normal;font-weight:900;font-display:swap;src:url('grandstander-latin-900-normal.woff2') format('woff2')}
@font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:swap;src:url('nunito-latin-600-normal.woff2') format('woff2')}

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
/* Layout : cahier d'autocollants — cartes à gros contour et ombre franche sur un fond vert tendre,
   un seul grand hublot rond pour l'animation de l'étape en cours. */
:root {
  --bg: #EEF6E3;
  --bg-dot: rgba(46, 36, 66, .07);
  --card: #FFFFFF;
  --card-2: #F6FAF0;
  --ink: #2E2442;
  --ink-soft: #655C7A;
  --line: #2E2442;
  --shadow: #2E2442;
  --leaf: #1E9E58;
  --leaf-soft: #D5F0DF;
  --on-leaf: #FFFFFF;
  --sun: #FFC93C;
  --sun-soft: #FFF0C2;
  --coral: #F0533F;
  --coral-soft: #FFE1DB;
  --on-coral-soft: #8A1F12;
  --sky: #3F97DD;
  --ring-track: #DCEACB;
  --field: #FFFFFF;
  --font-display: "Grandstander", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-card: 22px;
  --r-btn: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1930; --bg-dot: rgba(255, 255, 255, .05); --card: #2A2648; --card-2: #312C54;
    --ink: #F4F0FF; --ink-soft: #B9B0D6; --line: #0D0B1C; --shadow: #0B0918;
    --leaf: #1E9E58; --leaf-soft: #1F3F33; --on-leaf: #FFFFFF; --sun: #FFC93C; --sun-soft: #3D3520;
    --coral: #FF7462; --coral-soft: #4A2330; --on-coral-soft: #FFD6CF; --sky: #6CB6F0;
    --ring-track: #3A3560; --field: #221F3C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1930; --bg-dot: rgba(255, 255, 255, .05); --card: #2A2648; --card-2: #312C54;
  --ink: #F4F0FF; --ink-soft: #B9B0D6; --line: #0D0B1C; --shadow: #0B0918;
  --leaf: #1E9E58; --leaf-soft: #1F3F33; --on-leaf: #FFFFFF; --sun: #FFC93C; --sun-soft: #3D3520;
  --coral: #FF7462; --coral-soft: #4A2330; --on-coral-soft: #FFD6CF; --sky: #6CB6F0;
  --ring-track: #3A3560; --field: #221F3C; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--bg); color: var(--ink);
  background-image: radial-gradient(circle at 1px 1px, var(--bg-dot) 1.3px, transparent 1.7px);
  background-size: 22px 22px;
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { min-height: 100%; display: flex; flex-direction: column; }
.view {
  flex: 1; display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 760px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 32px;
}
.display { font-family: var(--font-display); font-weight: 900; letter-spacing: -.01em; line-height: 1.05; margin: 0; text-wrap: balance; }
.title { font-family: var(--font-display); font-weight: 900; font-size: clamp(22px, 6.2vw, 28px); margin: 0; flex: 1; min-width: 0; text-wrap: balance; }
.lead { margin: 0; font-size: 18px; color: var(--ink-soft); font-weight: 700; text-wrap: balance; }
.hint { margin: 0; color: var(--ink-soft); font-size: 15px; font-weight: 700; text-align: center; text-wrap: balance; }
.muted { color: var(--ink-soft); font-weight: 700; }

/* ---------- boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 10px 18px; border-radius: var(--r-btn);
  background: var(--card); color: var(--ink); border: 3px solid var(--line);
  box-shadow: 0 4px 0 var(--shadow); font-weight: 800; font-size: 17px; line-height: 1.1;
  transition: transform .08s ease, box-shadow .08s ease, background-color .15s;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.btn svg { width: 22px; height: 22px; flex: none; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn:disabled { opacity: .45; cursor: default; box-shadow: 0 2px 0 var(--shadow); }
.btn:focus-visible, .icon-opt:focus-visible, .pick:focus-visible, .kid-chip:focus-visible, .routine-card:focus-visible, .teaser:focus-visible, .swatch:focus-visible, .step-thumb:focus-visible, .tab:focus-visible {
  outline: 3px solid var(--sky); outline-offset: 3px;
}
.btn-primary { background: var(--leaf); color: var(--on-leaf); }
.btn-danger { background: var(--coral-soft); color: var(--on-coral-soft); }
.btn-sm { min-height: 42px; padding: 8px 14px; font-size: 15px; border-radius: 14px; box-shadow: 0 3px 0 var(--shadow); }
.btn-xs { min-height: 38px; min-width: 38px; padding: 6px; border-radius: 12px; box-shadow: 0 3px 0 var(--shadow); }
.btn-xs svg { width: 18px; height: 18px; }
.icon-btn { padding: 0; width: 48px; flex: none; }
.btn-sm.icon-btn { width: 42px; }
.btn-big { min-height: 60px; font-size: 21px; padding-inline: 26px; border-radius: 22px; }
.btn-add { border-style: dashed; box-shadow: none; background: transparent; min-height: 56px; width: 100%; }
.btn-add:active:not(:disabled) { transform: none; box-shadow: none; background: var(--card); }

.card { background: var(--card); border: 3px solid var(--line); border-radius: var(--r-card); box-shadow: 0 5px 0 var(--shadow); }

/* ---------- étoiles ---------- */
.star-ic { width: 26px; height: 26px; display: block; flex: none; }
.star-chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  padding: 5px 14px 5px 7px; border-radius: 999px; background: var(--sun-soft);
  border: 3px solid var(--line); box-shadow: 0 3px 0 var(--shadow);
  font-family: var(--font-display); font-weight: 900; font-size: 21px; line-height: 1; font-variant-numeric: tabular-nums;
}
.star-chip .star-ic { width: 28px; height: 28px; }
.bump { animation: bump .55s cubic-bezier(.3, 1.7, .5, 1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }

/* ---------- médaillons ---------- */
.medal { position: relative; border-radius: 50%; overflow: hidden; border: 3px solid var(--line); background: #fff; isolation: isolate; flex: none; }
.medal > .sc { position: absolute; inset: 0; }
.thumb { display: block; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid var(--line); background: #fff; flex: none; position: relative; }
.thumb > .sc { position: absolute; inset: 0; }

/* ---------- barre du haut ---------- */
.topbar { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand-face { width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--line); background: var(--leaf-soft); overflow: hidden; flex: none; }
.brand-face .sc { width: 100%; height: 100%; }
.brand-name { font-family: var(--font-display); font-weight: 900; font-size: 30px; letter-spacing: -.01em; }
.topbar-right { display: flex; align-items: center; gap: 10px; }

/* ---------- accueil ---------- */
.kid-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; padding: 2px 2px 4px; }
.kid-chip {
  display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 60px;
  padding: 6px 12px 6px 6px; border-radius: 22px; border: 3px solid var(--line);
  background: var(--card); box-shadow: 0 3px 0 var(--shadow); text-align: left;
}
.kid-chip .kid-face { width: 44px; height: 44px; }
.kid-chip-text { display: grid; min-width: 0; line-height: 1.15; }
.kid-chip-name { font-weight: 900; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kid-chip.is-on { background: var(--sun-soft); }
.kid-face { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; border: 2px solid var(--line); background: var(--leaf-soft); flex: none; display: block; }
.kid-face .sc { width: 100%; height: 100%; }
.kid-chip-stars { display: inline-flex; align-items: center; gap: 3px; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.kid-chip-stars .star-ic { width: 18px; height: 18px; }

.hero { display: flex; align-items: center; gap: 14px; }
.hero-medal { width: clamp(112px, 32vw, 150px); height: clamp(112px, 32vw, 150px); }
.bubble {
  position: relative; flex: 1; min-width: 0; padding: 14px 18px; border-radius: 22px;
  background: var(--card); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--shadow);
}
.bubble::before {
  content: ""; position: absolute; left: -13px; top: 50%; width: 20px; height: 20px; margin-top: -10px;
  background: var(--card); border-left: 3px solid var(--line); border-bottom: 3px solid var(--line);
  transform: rotate(45deg); border-bottom-left-radius: 4px;
}
.bubble p { margin: 0; position: relative; font-weight: 800; font-size: 17px; color: var(--ink-soft); }
.bubble .bubble-hi { font-family: var(--font-display); font-weight: 900; font-size: clamp(24px, 6.4vw, 32px); color: var(--ink); line-height: 1.05; margin-bottom: 4px; overflow-wrap: anywhere; }

.routine-list { display: grid; gap: 16px; }
@media (min-width: 720px) { .routine-list { grid-template-columns: 1fr 1fr; } }
.routine-card {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  padding: 14px; text-align: left; position: relative; color: var(--ink);
  transition: transform .1s ease, box-shadow .1s ease;
}
.routine-card:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.rc-icon { width: 64px; height: 64px; border-radius: 18px; border: 3px solid var(--line); background: var(--sun-soft); display: grid; place-items: center; flex: none; }
.rc-icon svg { width: 46px; height: 46px; }
.rc-icon.sm { width: 52px; height: 52px; border-radius: 15px; }
.rc-icon.sm svg { width: 38px; height: 38px; }
.rc-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rc-name { font-family: var(--font-display); font-weight: 900; font-size: 27px; line-height: 1.05; overflow-wrap: anywhere; }
.rc-meta { font-weight: 800; font-size: 15px; color: var(--ink-soft); }
.rc-thumbs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.rc-more { align-self: center; font-weight: 900; font-size: 14px; color: var(--ink-soft); }
.rc-go { width: 54px; height: 54px; border-radius: 50%; background: var(--leaf); color: var(--on-leaf); border: 3px solid var(--line); display: grid; place-items: center; box-shadow: 0 3px 0 var(--shadow); flex: none; }
.rc-go svg { width: 26px; height: 26px; margin-left: 3px; }
.rc-go.soft { background: var(--card-2); color: var(--ink); }
.rc-go.soft svg { margin-left: 0; }
.rc-done {
  position: absolute; top: -12px; right: 16px; display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px 3px 6px; border-radius: 999px; background: var(--leaf-soft); border: 2px solid var(--line);
  font-size: 13px; font-weight: 900;
}
.rc-done svg { width: 16px; height: 16px; }
.empty { padding: 22px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.empty p { margin: 0; font-weight: 800; color: var(--ink-soft); }

.teaser { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px; text-align: left; color: var(--ink); }
.teaser:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.teaser-icon { width: 48px; height: 48px; border-radius: 16px; border: 3px solid var(--line); background: var(--coral-soft); color: var(--ink); display: grid; place-items: center; }
.teaser-icon svg { width: 28px; height: 28px; }
.teaser .rc-go { width: 42px; height: 42px; }
.teaser .rc-go svg { width: 22px; height: 22px; }
.teaser-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.teaser-title { font-family: var(--font-display); font-weight: 900; font-size: 21px; line-height: 1.05; }
.teaser-sub { font-weight: 800; color: var(--ink-soft); font-size: 15px; overflow-wrap: anywhere; }
.bar { height: 14px; border-radius: 999px; border: 2.5px solid var(--line); background: var(--card-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--sun); border-right: 2.5px solid var(--line); border-radius: 0 999px 999px 0; }
.bar > span.full { border-right: 0; border-radius: 999px; }

/* ---------- récompenses (enfant) ---------- */
.reward-list { display: grid; gap: 14px; }
.reward { display: grid; grid-template-columns: auto 1fr; gap: 12px 14px; align-items: center; padding: 14px; }
.reward.is-ready { background: var(--sun-soft); }
.reward-emoji { width: 62px; height: 62px; display: grid; place-items: center; font-size: 36px; border-radius: 18px; border: 3px solid var(--line); background: var(--card); }
.reward-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.reward-name { font-family: var(--font-display); font-weight: 900; font-size: 22px; line-height: 1.1; overflow-wrap: anywhere; }
.reward-cost { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-variant-numeric: tabular-nums; }
.reward-cost .star-ic { width: 20px; height: 20px; }
.reward .btn { grid-column: 1 / -1; }

/* ---------- déroulé d'une routine ---------- */
#app[data-view="run"] { height: 100%; min-height: 0; }
.run {
  max-width: none; height: 100%; min-height: 0; gap: 10px;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr);
  padding-block: 10px 16px;
}
.run-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.run-top-left { display: flex; gap: 8px; }
.run-top-left #musicBtn[aria-pressed="false"] { color: var(--ink-soft); }
.run-progress { list-style: none; margin: 0; padding: 4px 2px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
.run-progress::-webkit-scrollbar { display: none; }
.pdot { position: relative; width: 30px; height: 30px; flex: none; border-radius: 50%; }
.pdot .thumb { width: 30px; height: 30px; opacity: .55; }
.pdot.is-now .thumb { opacity: 1; box-shadow: 0 0 0 3px var(--sun); }
.pdot.is-done .thumb, .pdot.is-skip .thumb { opacity: 1; filter: saturate(.55); }
.pdot.is-skip .thumb { opacity: .35; filter: grayscale(1); }
.pdot-mark { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: var(--leaf); color: #fff; border: 2px solid var(--line); }
.pdot-mark svg { width: 11px; height: 11px; }
.pdot-mark.pill { width: auto; min-width: 28px; height: 18px; right: -9px; bottom: -6px; padding: 0 3px 0 5px; gap: 1px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--sun-soft); color: var(--ink); font-size: 11px; font-weight: 900; line-height: 1; }
.pdot-mark.pill .star-ic { width: 12px; height: 12px; }
.pdot { margin-right: 4px; }

.run-stage { display: grid; place-items: center; min-height: 0; container-type: size; }
.stage { position: relative; width: min(86vw, 50vh, 480px); aspect-ratio: 1; }
@supports (width: 1cqh) { .stage { width: min(100cqw, 100cqh, 480px); } }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring-track { fill: none; stroke: var(--ring-track); stroke-width: 7; }
.ring-bar {
  fill: none; stroke: var(--ring-color, var(--leaf)); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 100 100;
  transform: rotate(-90deg); transform-origin: 50px 50px; transition: stroke-dashoffset .3s linear, stroke .6s;
}
.ring-dot { transform-origin: 50px 50px; transition: transform .3s linear; }
.ring-tick { stroke: var(--line); stroke-width: 1.6; stroke-linecap: round; opacity: .6; }
.ring-dot circle { fill: #fff; stroke: var(--line); stroke-width: 2.2; }
.stage[data-level="ok"] { --ring-color: #2BB673; }
.stage[data-level="mid"] { --ring-color: #F2B21B; }
.stage[data-level="low"] { --ring-color: #FF8A3D; }
.stage[data-level="late"] { --ring-color: var(--coral); }
.stage-medal { position: absolute; inset: 9.5%; border-width: 4px; }
.stage[data-level="late"] .stage-medal { animation: late 1.3s ease-in-out infinite; }
@keyframes late { 0%, 100% { box-shadow: 0 0 0 0 rgba(240, 83, 63, .0); } 50% { box-shadow: 0 0 0 10px rgba(240, 83, 63, .35); } }
.stage-medal.pop-in { animation: popin .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes popin { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.stage-pause {
  position: absolute; inset: 9.5%; border-radius: 50%; display: grid; place-content: center; justify-items: center; gap: 6px;
  background: rgba(27, 25, 48, .55); color: #fff; font-family: var(--font-display); font-weight: 900; font-size: 26px; border: 0;
}
.stage-pause svg { width: 64px; height: 64px; }
.run-info { text-align: center; display: grid; gap: 2px; }
.run-count { margin: 0; font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.run-label { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: clamp(26px, 7vw, 38px); line-height: 1.05; text-wrap: balance; overflow-wrap: anywhere; }
.run-meter { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
.pot { display: inline-flex; gap: 1px; padding: 3px 8px; border-radius: 999px; background: var(--sun-soft); border: 3px solid var(--line); }
.pot-star { width: 30px; height: 30px; display: block; transition: transform .35s, opacity .35s, filter .35s; }
.pot-star .star-ic { width: 100%; height: 100%; }
.pot-star.is-lost { filter: grayscale(1); opacity: .28; transform: scale(.72); }
.pot-star.just-lost { animation: lose .8s ease-in; }
@keyframes lose { 0% { transform: scale(1.3); opacity: 1; filter: none; } 35% { transform: translateY(-8px) rotate(-25deg) scale(1.1); opacity: 1; filter: none; } 100% { transform: scale(.72); opacity: .28; filter: grayscale(1); } }
.run-time { margin: 0; font-weight: 900; font-size: clamp(30px, 8vw, 44px); line-height: 1; font-variant-numeric: tabular-nums; }
.run-time.is-late { color: var(--coral); }
.run-late-msg { margin: 0; font-weight: 800; color: var(--coral); font-size: 15px; min-height: 1.4em; }
.run-controls { display: grid; grid-template-columns: auto minmax(0, 340px) auto; justify-content: center; align-items: center; gap: 14px; }
.ctl { width: 60px; min-height: 60px; border-radius: 20px; }
.ctl svg { width: 26px; height: 26px; }
.done-btn { min-height: 70px; font-family: var(--font-display); font-weight: 900; font-size: 27px; border-radius: 24px; box-shadow: 0 6px 0 var(--shadow); width: 100%; }
.done-btn svg { width: 32px; height: 32px; stroke-width: 3.4; }
.done-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--shadow); }
@media (orientation: landscape) and (min-width: 640px) {

/* ---------- fin de routine ---------- */

/* ---------- accueil / chargement ---------- */

/* ---------- formulaires ---------- */

.field, .form-card input[type="text"], .form-card input:not([type]) {

}

.swatches { display: flex; flex-wrap: wrap; gap: 8px; border: 0; padding: 0; margin: 0; }

/* ---------- espace parents ---------- */

.tab { min-width: 0; min-height: 42px; padding: 8px 10px; border-radius: 12px; border: 0; background: transparent; font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab[aria-selected="true"] { background: var(--sun-soft); box-shadow: inset 0 0 0 2.5px var(--line); }
.stack { display: grid; gap: 16px; }
.p-card { padding: 16px; display: grid; gap: 12px; }
.p-card-head { display: flex; align-items: center; gap: 12px; }
.p-card-title { min-width: 0; flex: 1; }

.icon-pick { display: flex; flex-wrap: wrap; gap: 8px; }

.who-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 50px; padding: 4px 14px 4px 4px; border-radius: 999px; border: 3px solid var(--line); background: var(--card-2); font-weight: 900; font-size: 16px; }

.who-chip.is-on { background: var(--sun-soft); }

.who-chip:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

.step-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: step; }

.step-row::before {

  display: grid; place-items: center; background: var(--sun); border: 2.5px solid var(--line); color: #2E2442; font-weight: 900; font-size: 13px; z-index: 1;
}

.step-thumb-edit { position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 2px solid var(--line); display: grid; place-items: center; color: var(--ink); }
.step-thumb-edit svg { width: 14px; height: 14px; }
.step-fields { display: grid; gap: 6px; min-width: 0; }
.step-input { width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 12px; border: 2.5px solid var(--line); background: var(--field); font-weight: 800; font-size: 16px; }

.step-kind { font-size: 13px; font-weight: 800; color: var(--ink-soft); }

.step-tools { display: grid; gap: 6px; }
.editor-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
@media (max-width: 420px) {
  .step-row { grid-template-columns: auto minmax(0, 1fr); }
  .step-tools { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
  .step-thumb { width: 60px; height: 60px; }
}

.kid-head { display: flex; gap: 12px; align-items: center; }
.kid-head .kid-face { width: 60px; height: 60px; border-width: 3px; }
.kid-fields { flex: 1; min-width: 0; display: grid; gap: 4px; }
.kid-fields label { font-weight: 900; font-size: 14px; }
.kid-fields input { width: 100%; min-height: 46px; padding: 8px 12px; border-radius: 12px; border: 2.5px solid var(--line); background: var(--field); font-weight: 800; font-size: 17px; }

.history summary { cursor: pointer; font-weight: 900; padding: 6px 0; }
.history ul { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.history li { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-size: 15px; padding: 6px 0; border-bottom: 2px dashed var(--ring-track); }

.history .plus { color: var(--leaf); }
.history .minus { color: var(--coral); }

.reward-edit { grid-template-columns: auto minmax(0, 1fr); align-items: center; }

.reward-edit .rw-name { width: 100%; min-height: 48px; padding: 8px 12px; border-radius: 12px; border: 2.5px solid var(--line); background: var(--field); font-weight: 800; font-size: 17px; }
.rw-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rw-cost { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; margin-right: auto; }
.rw-cost input { width: 84px; min-height: 44px; padding: 6px 10px; border-radius: 12px; border: 2.5px solid var(--line); background: var(--field); font-weight: 900; font-size: 17px; font-variant-numeric: tabular-nums; }

.switch-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; }
.switch-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.switch-title { font-weight: 900; font-size: 17px; }
.switch-desc { font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.switch { appearance: none; -webkit-appearance: none; width: 58px; height: 34px; border-radius: 999px; border: 3px solid var(--line); background: var(--ring-track); position: relative; flex: none; margin: 0; cursor: pointer; transition: background-color .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2.5px solid var(--line); transition: transform .15s; box-sizing: border-box; }
.switch:checked { background: var(--leaf); }
.switch:checked::after { transform: translateX(24px); }

/* ---------- fenêtres ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(27, 25, 48, .5); padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(100%, 440px); max-height: 100%; overflow: auto; background: var(--card); color: var(--ink); border: 3px solid var(--line); border-radius: 26px; box-shadow: 0 6px 0 var(--shadow); padding: 20px; display: grid; gap: 14px; animation: rise .2s cubic-bezier(.3, 1.4, .5, 1); }
.modal-wide { width: min(100%, 720px); }
@keyframes rise { from { transform: translateY(16px) scale(.97); opacity: 0; } }
.modal-title { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.modal p { margin: 0; font-weight: 700; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.modal-center { text-align: center; justify-items: center; }
.modal-medal { width: 160px; height: 160px; }
.gate-q { font-family: var(--font-display); font-weight: 900; font-size: 40px; text-align: center; }
.gate input { width: 100%; min-height: 56px; text-align: center; font-size: 28px; font-weight: 900; border-radius: 16px; border: 3px solid var(--line); background: var(--field); }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 6px; }
.pick { display: grid; justify-items: center; gap: 6px; padding: 8px 4px; border-radius: 18px; border: 3px solid transparent; background: transparent; }
.pick:hover { background: var(--card-2); border-color: var(--line); }
.pick.is-on { background: var(--sun-soft); border-color: var(--line); }
.pick-medal { width: 76px; height: 76px; }
.pick-name { font-weight: 800; font-size: 13px; line-height: 1.15; text-align: center; }
.tpl-grid { display: grid; gap: 10px; }
.tpl { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 12px; text-align: left; border-radius: 18px; border: 3px solid var(--line); background: var(--card-2); box-shadow: 0 3px 0 var(--shadow); }
.tpl strong { font-family: var(--font-display); font-size: 20px; display: block; }
.tpl span span { font-weight: 700; color: var(--ink-soft); font-size: 14px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 30px); opacity: 0; visibility: hidden; z-index: 70; max-width: min(92vw, 460px); padding: 12px 18px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 800; box-shadow: 0 4px 0 var(--shadow); transition: transform .25s cubic-bezier(.3, 1.4, .5, 1), opacity .2s, visibility .2s; text-align: center; }
.toast.is-on { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

@media (prefers-reduced-motion: reduce) {
  .bump, .stage-medal.pop-in, .modal, .modal-wrap, .end-step, .shake, .pot-star.just-lost { animation: none !important; }
  .ring-bar, .ring-dot { transition: none; }
}

/* ---------- connexion (version installable) ---------- */
.auth { justify-content: center; }
.auth-card { width: 100%; max-width: 460px; margin-inline: auto; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 16px; border: 3px solid var(--line); background: var(--card-2); }

.auth-error.ok { color: var(--leaf); }
.link-btn { background: none; border: 0; padding: 6px; color: var(--ink-soft); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: center; align-self: center; }
.code, .code-input { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; }

label:has(+ input[type="file"]:focus-visible) { outline: 3px solid var(--sky); outline-offset: 3px; }
.auth-card .field { font-size: 17px; }
.pw-wrap { position: relative; }
.pw-wrap .field { padding-right: 104px; }
.pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); min-height: 36px; padding: 0 12px; border-radius: 10px; border: 2.5px solid var(--line); background: var(--card-2); font-weight: 900; font-size: 14px; }
.check-row { display: flex; gap: 10px; align-items: flex-start; font-weight: 800; }
.check-row input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--leaf); flex: none; }

.auth-or::before, .auth-or::after { content: ""; flex: 1; border-top: 2.5px dashed var(--ink-soft); opacity: .45; }
.auth-small { font-size: 14px; color: var(--ink-soft); font-weight: 700; margin: 0; }
.auth-card h3 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 900; }
.auth-card .auth-small { margin-top: -4px; }

/* ============ Pépin — animations des scènes ============ */
.sc { display: block; width: 100%; height: 100%; overflow: hidden; }
.pp-body, .pp-skin { fill: var(--pp-body, #FF8A5B); }
.pp-limb { stroke: var(--pp-body, #FF8A5B); }
.pp-belly { fill: var(--pp-belly, #FFC9A8); }
.pp-dark { fill: var(--pp-dark, #E0623A); }

/* yeux, pupilles, pousse */
.pp-eyes { transform-box: fill-box; transform-origin: center; animation: pp-blink 4.6s infinite; }
@keyframes pp-blink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } }
.pp-p-down { transform: translate(0, 4px); }
.pp-p-right { transform: translate(4px, 1px); }
.pp-p-left { transform: translate(-4px, 1px); }
.pp-p-look { animation: pp-look 5s ease-in-out infinite; }
@keyframes pp-look { 0%, 18% { transform: translate(-4px, 0); } 26%, 56% { transform: translate(4px, -1px); } 64%, 82% { transform: translate(0, -3px); } 90%, 100% { transform: translate(-4px, 0); } }
.pp-p-read { transform: translate(0, 4px); animation: pp-read 5s ease-in-out infinite; }
@keyframes pp-read {
  0% { transform: translate(-4px, 4px); } 15% { transform: translate(4px, 4px); } 18% { transform: translate(-4px, 5px); }
  33% { transform: translate(4px, 5px); } 36% { transform: translate(-4px, 6px); } 52% { transform: translate(4px, 6px); }
  58%, 82% { transform: translate(3px, 3px); } 100% { transform: translate(-4px, 4px); }
}
.pp-sprout { transform-origin: 0 -60px; animation: pp-sway 3.4s ease-in-out infinite alternate; }
@keyframes pp-sway { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }
.pp-droop { transform: rotate(36deg); animation: pp-droop 3.6s ease-in-out infinite alternate; }
@keyframes pp-droop { from { transform: rotate(32deg); } to { transform: rotate(40deg); } }
.pp-cheek { transform-box: fill-box; transform-origin: center; }

/* communs */
.a-spin-slow { animation: a-spin 26s linear infinite; }
.a-spin-fast { animation: a-spin 1.1s linear infinite; }
@keyframes a-spin { to { transform: rotate(360deg); } }
.a-drift { animation: a-drift 7s ease-in-out infinite alternate; }
.a-drift2 { animation: a-drift 9s ease-in-out infinite alternate-reverse; }
@keyframes a-drift { from { transform: translateX(-10px); } to { transform: translateX(12px); } }
.a-wave { transform-origin: 40px 16px; animation: a-wave .9s ease-in-out infinite alternate; }
@keyframes a-wave { from { transform: rotate(-14deg); } to { transform: rotate(20deg); } }
.a-bob { animation: a-bob 2.4s ease-in-out infinite alternate; }
@keyframes a-bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
.a-twink { animation: a-twink 2.2s ease-in-out infinite; }
.a-twink.t2 { animation-delay: -.7s; } .a-twink.t3 { animation-delay: -1.4s; } .a-twink.t4 { animation-delay: -1s; }
@keyframes a-twink { 0%, 100% { transform: scale(.25) rotate(0); opacity: .35; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }

@keyframes tb-pop3 { 0%, 59% { transform: scale(0); opacity: 0; } 63% { transform: scale(1.35); opacity: 1; } 66%, 88% { transform: scale(1); opacity: 1; } 93%, 100% { transform: scale(1); opacity: 0; } }
.a-tb-hop { animation: tb-hop 5.2s ease-in-out infinite; }
@keyframes tb-hop { 0%, 68% { transform: translateY(0); } 72% { transform: translateY(-9px); } 76% { transform: translateY(0); } 80% { transform: translateY(-6px); } 84%, 100% { transform: translateY(0); } }
.sc-table .a-twink { animation: tb-twink 5.2s ease-in-out infinite; }
.sc-table .a-twink.t2 { animation-delay: -5.05s; } .sc-table .a-twink.t3 { animation-delay: -4.9s; }
@keyframes tb-twink { 0%, 68% { transform: scale(0); opacity: 0; } 76% { transform: scale(1.1) rotate(45deg); opacity: 1; } 86%, 100% { transform: scale(0) rotate(90deg); opacity: 0; } }

/* nourrir le chat */
.a-box { transform-origin: 0 0; transform: rotate(20deg); animation: ch-box 5.2s ease-in-out infinite; }
@keyframes ch-box { 0%, 2% { transform: rotate(20deg); } 9% { transform: rotate(112deg); } 14% { transform: rotate(104deg); } 19% { transform: rotate(114deg); } 24% { transform: rotate(104deg); } 29% { transform: rotate(114deg); } 34% { transform: rotate(106deg); } 40% { transform: rotate(112deg); } 48%, 100% { transform: rotate(20deg); } }
.a-pour { opacity: 0; animation: ch-pour 5.2s linear infinite; }
@keyframes ch-pour { 0%, 9% { opacity: 0; } 10%, 40% { opacity: 1; } 41%, 100% { opacity: 0; } }
.a-k { animation: ch-k .5s linear infinite; }
.a-k.k1 { animation-delay: -.1s; } .a-k.k2 { animation-delay: -.2s; } .a-k.k3 { animation-delay: -.3s; } .a-k.k4 { animation-delay: -.4s; }
@keyframes ch-k { from { transform: translate(0, 0); } to { transform: translate(5px, 28px); } }
.a-mound { transform-origin: 52px 54px; animation: ch-mound 5.2s ease-in-out infinite; }
@keyframes ch-mound { 0%, 10% { transform: scaleY(0); } 42%, 70% { transform: scaleY(1); } 88%, 100% { transform: scaleY(0); } }
.a-tail { transform-origin: 16px -6px; animation: ch-tail 1.6s ease-in-out infinite alternate; }
@keyframes ch-tail { from { transform: rotate(-10deg); } to { transform: rotate(14deg); } }
.a-cat-look { transform: translateX(-1.8px); }
.a-cat-head { transform-origin: 0 -38px; animation: ch-head 5.2s ease-in-out infinite; }
@keyframes ch-head {
  0%, 44% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(-24px, 22px) rotate(-26deg); }
  56% { transform: translate(-24px, 25px) rotate(-26deg); } 62% { transform: translate(-24px, 22px) rotate(-26deg); }
  68% { transform: translate(-24px, 25px) rotate(-26deg); } 74% { transform: translate(-24px, 22px) rotate(-26deg); }
  80% { transform: translate(-24px, 25px) rotate(-26deg); } 86% { transform: translate(-24px, 22px) rotate(-26deg); }
  92%, 100% { transform: translate(0, 0) rotate(0); }
}
.a-cat-body { transform-origin: 0 0; animation: ch-body 5.2s ease-in-out infinite; }
@keyframes ch-body { 0%, 44% { transform: rotate(0); } 50%, 86% { transform: rotate(-6deg); } 92%, 100% { transform: rotate(0); } }
.a-cat-ec { opacity: 0; animation: ch-ec 5.2s linear infinite; }
@keyframes ch-ec { 0%, 49% { opacity: 0; } 50%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.a-cat-eo { animation: ch-eo 5.2s linear infinite; }
@keyframes ch-eo { 0%, 49% { opacity: 1; } 50%, 88% { opacity: 0; } 89%, 100% { opacity: 1; } }
.a-mlove { opacity: 0; animation: ch-love 5.2s ease-out infinite; }
.a-mlove.h2 { animation-delay: -4.6s; }
@keyframes ch-love { 0%, 54% { transform: translateY(8px) scale(.4); opacity: 0; } 60% { opacity: 1; } 80% { transform: translateY(-30px) scale(1.1); opacity: 0; } 100% { opacity: 0; } }

/* états : vignette figée, pause */
.is-still .sc *, .sc.is-still * { animation: none !important; }
.is-paused .sc *, .sc.is-paused * { animation-play-state: paused !important; }

.swatch:focus-within { outline: 3px solid var(--sky); outline-offset: 3px; }
</style>
</head>
<body>
<div id="app" data-view="loading"><section class="view center-view"><p class="lead">Chargement…</p></section></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>window.PepinHost = true;</script>
<script src="firebase-config.js"></script>
<script src="firebase.js"></script>
<script>
/* ============================================================
   Pépin — bibliothèque de scènes animées (SVG + CSS)
   Personnage original : un pépin rond avec une pousse sur la tête.
   Toutes les scènes sont dessinées dans un viewBox 300×300 et
   affichées dans un médaillon circulaire.
   ============================================================ */
(function (global) {
  'use strict';

  const INK = '#2E2442';
  const SW = 3.5;
  const BODY = 'M0,-62 C18,-56 50,-28 50,10 C50,42 28,60 0,60 C-28,60 -50,42 -50,10 C-50,-28 -18,-56 0,-62 Z';

  const st = (w = 3) => `stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
  const r2 = (n) => Math.round(n * 100) / 100;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- briques du personnage ---------- */
  function limb(d) {
    return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="${d}" fill="none" class="pp-limb" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  const hand = (x, y, r = 7.5) => `<circle cx="${x}" cy="${y}" r="${r}" class="pp-skin" ${st(3)}/>`;
  const patch = (x, y) => `<circle cx="${x}" cy="${y}" r="7.4" class="pp-skin"/>`;

  const ARM_L = `<g class="pp-arm-l">${limb('M-40,16 Q-54,24 -62,44')}${hand(-62, 45)}</g>`;
  const ARM_R = `<g class="pp-arm-r">${limb('M40,16 Q54,24 62,44')}${hand(62, 45)}</g>`;
  const ARMS_UP = `<g class="pp-up-l">${limb('M-40,16 Q-57,4 -61,-18')}${hand(-61, -19)}</g>` +
    `<g class="pp-up-r">${limb('M40,16 Q57,4 61,-18')}${hand(61, -19)}</g>`;

  const foot = (x) => `<ellipse cx="${x}" cy="58" rx="14.5" ry="8.5" class="pp-dark" ${st(3)}/>`;
  const FEET = `<g class="pp-feet">${foot(-21)}${foot(21)}</g>`;

  const SPROUT =
    `<path d="M0,-58 C0,-66 2,-72 5,-78" fill="none" stroke="${INK}" stroke-width="7.5" stroke-linecap="round"/>` +
    `<path d="M0,-58 C0,-66 2,-72 5,-78" fill="none" stroke="#5DB861" stroke-width="3.6" stroke-linecap="round"/>` +
    `<path d="M5,-77 C-2,-92 -20,-94 -27,-84 C-18,-74 -4,-72 5,-77 Z" fill="#7ED36F" ${st(3)}/>` +
    `<path d="M5,-78 C12,-96 30,-100 37,-90 C30,-78 16,-74 5,-78 Z" fill="#94E07F" ${st(3)}/>` +
    `<path d="M4,-78 C-5,-83 -13,-85 -19,-84" fill="none" stroke="#4FA455" stroke-width="2" stroke-linecap="round"/>` +
    `<path d="M6,-79 C15,-86 23,-89 29,-89" fill="none" stroke="#4FA455" stroke-width="2" stroke-linecap="round"/>`;

  const CHEEKS = `<ellipse class="pp-cheek" cx="-32" cy="-1" rx="7.5" ry="4.6" fill="#FF7F9C" opacity=".55"/>` +
    `<ellipse class="pp-cheek" cx="32" cy="-1" rx="7.5" ry="4.6" fill="#FF7F9C" opacity=".55"/>`;

  function openEyes(kind) {
    const w = (cx) => `<ellipse cx="${cx}" cy="-18" rx="11" ry="13" fill="#fff" ${st(3)}/>`;
    return `<g class="pp-eyes">${w(-17)}${w(17)}<g clip-path="url(#ppEyeClip)"><g class="pp-pupils pp-p-${kind}">` +
      `<circle cx="-16" cy="-15" r="6.6" fill="${INK}"/><circle cx="16" cy="-15" r="6.6" fill="${INK}"/>` +
      `<circle cx="-13.6" cy="-18" r="2.3" fill="#fff"/><circle cx="18.4" cy="-18" r="2.3" fill="#fff"/></g></g></g>`;
  }
  const HAPPY_EYES = `<path d="M-27,-14 Q-17,-28 -7,-14" fill="none" ${st(3.8)}/><path d="M7,-14 Q17,-28 27,-14" fill="none" ${st(3.8)}/>`;
  const CLOSED_EYES = `<path d="M-27,-17 Q-17,-8 -7,-17" fill="none" ${st(3.8)}/><path d="M7,-17 Q17,-8 27,-17" fill="none" ${st(3.8)}/>`;

  function eyes(kind) {
    if (kind === 'happy') return HAPPY_EYES;
    if (kind === 'closed') return CLOSED_EYES;
    if (kind === 'yawn') return `<g class="a-eo">${openEyes('open')}</g><g class="a-ec">${CLOSED_EYES}</g>`;
    return openEyes(kind || 'open');
  }

  const MOUTH_RED = '#8A2F45';
  function mouth(kind) {
    switch (kind) {
      case 'grin':
        return `<path d="M-11,-1 Q0,16 11,-1 Z" fill="${MOUTH_RED}" ${st(3)}/><path d="M-5,7.5 Q0,4.5 5,7.5 Q0,10.5 -5,7.5 Z" fill="#FF7E93"/>`;
      case 'teeth':
        return `<path d="M-12,-2 Q0,15 12,-2 Z" fill="#fff" ${st(3)}/><path d="M-6,-1.5 V4.2 M0,-1.5 V6.5 M6,-1.5 V4.2" stroke="#D6DCE8" stroke-width="1.6"/>`;
      case 'chew':
        return `<ellipse class="a-chew" cx="0" cy="3" rx="6.5" ry="6.5" fill="${MOUTH_RED}" ${st(3)}/>`;
      case 'yawn':
        return `<ellipse class="a-yawn" cx="0" cy="4" rx="6.5" ry="7" fill="${MOUTH_RED}" ${st(3)}/>`;
      case 'o':
        return `<ellipse cx="0" cy="3.5" rx="3.6" ry="4.2" fill="${MOUTH_RED}" ${st(2.6)}/>`;
      case 'tongue':
        return `<path d="M-8,0 Q0,8 8,0" fill="none" ${st(3.2)}/><path d="M4,3 Q9,10 12,4 Z" fill="#FF7E93" ${st(2)}/>`;
      default:
        return `<path d="M-8,0 Q0,8 8,0" fill="none" ${st(3.2)}/>`;
    }
  }

  /** Le personnage, centré en (0,0) — pousse en haut (y≈-100), pieds en bas (y≈66). */
  function char(o = {}) {
    const sprout = o.sprout === false ? '' : `<g class="pp-sprout${o.droop ? ' pp-droop' : ''}">${SPROUT}</g>`;
    const back = o.back !== undefined ? o.back : ARM_L + ARM_R;
    return `<g class="pp">${back}${sprout}` +
      `<path d="${BODY}" class="pp-body" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>` +
      `<ellipse cx="0" cy="33" rx="29" ry="24" class="pp-belly"/>` +
      (o.clothes ? o.clothes + `<path d="${BODY}" fill="none" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>` : '') +
      (o.blush === false ? '' : CHEEKS) +
      `<g class="pp-face">${eyes(o.eyes)}${mouth(o.mouth)}</g>` +
      (o.feet === false ? '' : (o.feet || FEET)) +
      (o.front || '') + `</g>`;
  }

  /* ---------- petits accessoires ---------- */
  const wrap = (x, y, s, inner, cls) => `<g transform="translate(${x} ${y}) scale(${s})"${cls ? ` class="${cls}"` : ''}>${inner}</g>`;
  const at = (x, y, inner, extra = '') => `<g transform="translate(${x} ${y})${extra}">${inner}</g>`;

  function star5(r, fill = '#FFC93C', sw = 3) {
    const p = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 ? r * 0.5 : r;
      p.push(`${r2(Math.cos(a) * rr)},${r2(Math.sin(a) * rr)}`);
    }
    return `<path d="M${p.join('L')}Z" fill="${fill}" ${st(sw)}/>`;
  }
  function spark(r, fill = '#fff') {
    const k = r * 0.18;
    return `<path d="M0,${-r} Q${r2(k)},${r2(-k)} ${r},0 Q${r2(k)},${r2(k)} 0,${r} Q${r2(-k)},${r2(k)} ${-r},0 Q${r2(-k)},${r2(-k)} 0,${-r} Z" fill="${fill}"/>`;
  }
  const HEART = 'M0,22 C-36,0 -34,-26 -16,-26 C-6,-26 0,-18 0,-12 C0,-18 6,-26 16,-26 C34,-26 36,0 0,22 Z';

  function sun(x, y, r = 21) {
    let rays = '';
    for (let i = 0; i < 8; i++) {
      rays += `<path d="M0,${-(r + 7)} V${-(r + 15)}" stroke="${INK}" stroke-width="8.5" stroke-linecap="round" transform="rotate(${i * 45})"/>` +
        `<path d="M0,${-(r + 7)} V${-(r + 15)}" stroke="#FFC93C" stroke-width="4" stroke-linecap="round" transform="rotate(${i * 45})"/>`;
    }
    return at(x, y, `<g class="a-spin-slow">${rays}</g><circle r="${r}" fill="#FFD34D" ${st(3.5)}/><circle cx="-6" cy="-6" r="5" fill="#fff" opacity=".45"/>`);
  }
  const CLOUD = `M-34,12 C-47,12 -47,-7 -32,-7 C-30,-23 -8,-27 0,-15 C8,-27 32,-23 30,-5 C45,-5 45,12 32,12 Z`;
  const cloud = (x, y, s, cls = 'a-drift') => at(x, y, `<g class="${cls}"><path d="${CLOUD}" fill="#fff" ${st(3)}/></g>`, ` scale(${s})`);

  function clock(x, y, r = 19) {
    let ticks = '';
    for (let i = 0; i < 12; i += 3) ticks += `<path d="M0,${-(r - 4)} V${-(r - 7)}" stroke="${INK}" stroke-width="2.4" stroke-linecap="round" transform="rotate(${i * 30})"/>`;
    return at(x, y, `<circle r="${r}" fill="#fff" ${st(3.5)}/>${ticks}` +
      `<path class="a-clk-h" d="M0,0 V${-(r * 0.45)}" stroke="${INK}" stroke-width="3.4" stroke-linecap="round"/>` +
      `<path class="a-clk-m" d="M0,0 V${-(r * 0.72)}" stroke="#FF7A59" stroke-width="2.6" stroke-linecap="round"/>` +
      `<circle r="2.6" fill="${INK}"/>`);
  }

  function frame(x, y, w, h, inner = '') {
    return at(x, y, `<rect x="${-w / 2}" y="${-h / 2}" width="${w}" height="${h}" rx="6" fill="#FFF8EE" ${st(3.5)}/>${inner}`);
  }

  function floor(y, fill, pattern) {
    return `<rect y="${y}" width="300" height="${300 - y}" fill="${fill}"/>` +
      (pattern ? `<rect y="${y}" width="300" height="${300 - y}" fill="url(#${pattern})"/>` : '') +
      `<path d="M0,${y}H300" ${st(3.5)}/>`;
  }
  const wall = (fill, pattern = 'pDots') => `<rect width="300" height="300" fill="${fill}"/>` + (pattern ? `<rect width="300" height="300" fill="url(#${pattern})"/>` : '');

  function foamCloud(pts, w = 2.6) {
    return pts.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="${w}"/>`).join('') +
      pts.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r2(r - w * 0.55)}" fill="#fff"/>`).join('');
  }
  function bubbles(list, cls = 'a-bub') {
    return list.map(([x, y, r], i) => at(x, y, `<g class="${cls} b${i}"><circle r="${r}" fill="#fff" fill-opacity=".75" stroke="#6FC3E8" stroke-width="2"/><circle cx="${r2(-r * 0.35)}" cy="${r2(-r * 0.35)}" r="${r2(r * 0.25)}" fill="#fff"/></g>`)).join('');
  }

  /* ============================================================
     SCÈNES
     ============================================================ */
  const S = {};

  /* ----- Accueil : Pépin fait coucou ----- */
  S.hello = () => {
    const bg = `<rect width="300" height="300" fill="url(#gSky)"/>` + sun(236, 70) + cloud(74, 78, 0.95) + cloud(196, 132, 0.62, 'a-drift2') +
      `<path d="M0,232 Q80,214 150,224 Q230,234 300,218 V300 H0 Z" fill="#8ED16F" ${st(3.5)}/>` +
      flowers([[46, 252], [252, 246], [222, 272]]);
    const wave = `<g class="a-wave">${limb('M40,16 Q57,8 64,-14')}${hand(64, -15)}</g>`;
    return bg + wrap(150, 168, 1.02, char({ back: ARM_L + wave, mouth: 'grin' }));
  };
  function flowers(list) {
    return list.map(([x, y], i) => at(x, y, `<path d="M0,0 V-14" stroke="#3E8E41" stroke-width="3" stroke-linecap="round"/>` +
      [0, 72, 144, 216, 288].map((a) => `<ellipse cx="0" cy="-22" rx="4.5" ry="6.5" fill="${['#FF8FB1', '#FFD34D', '#FFFFFF'][i % 3]}" ${st(2)} transform="rotate(${a} 0 -16)"/>`).join('') +
      `<circle cy="-16" r="3.6" fill="#FFB33F" ${st(2)}/>`)).join('');
  }

  /* ----- Bravo : saut de joie ----- */
  S.bravo = () => {
    let rays = '';
    for (let i = 0; i < 12; i++) rays += `<path d="M0,0 L-30,-230 L30,-230 Z" fill="#FFE38A" transform="rotate(${i * 30})"/>`;
    const bg = `<rect width="300" height="300" fill="#FFCB3D"/>` + at(150, 150, `<g class="a-spin-slow">${rays}</g>`);
    const pops = [[-84, -56, 15, 1], [86, -36, 12, 2], [-74, 34, 10, 3], [82, 44, 13, 4], [0, -128, 10, 5]]
      .map(([x, y, r, i]) => at(x, y, `<g class="a-pop p${i}">${star5(r)}</g>`)).join('');
    const body = `<g class="a-jump">${char({ back: `<g class="a-cheer-l">${limb('M-40,16 Q-57,4 -61,-18')}${hand(-61, -19)}</g><g class="a-cheer-r">${limb('M40,16 Q57,4 61,-18')}${hand(61, -19)}</g>`, eyes: 'happy', mouth: 'grin' })}</g>`;
    return bg + wrap(150, 170, 1.04, body + pops);
  };

  /* ----- Chargement / attente : Pépin s'étire ----- */
  S.idle = () => {
    const bg = wall('#E7F5E1') + `<circle cx="150" cy="150" r="96" fill="#fff" opacity=".55"/>`;
    return bg + wrap(150, 166, 1.02, `<g class="a-bob">${char({ mouth: 'smile' })}</g>`);
  };

  /* ----- Manger ----- */
  S.manger = () => {
    const bg = wall('#FFE29A') + clock(238, 76) +
      at(72, 86, `<rect x="-28" y="-26" width="56" height="50" rx="8" fill="#BFE6FF" ${st(3.5)}/><path d="M0,-26 V24 M-28,-1 H28" ${st(3)}/>` +
        `<path d="M-32,-30 Q-20,-8 -30,26" fill="none" stroke="#F26D6D" stroke-width="7" stroke-linecap="round"/><path d="M32,-30 Q20,-8 30,26" fill="none" stroke="#F26D6D" stroke-width="7" stroke-linecap="round"/>`);
    const table = `<rect x="-170" y="56" width="340" height="150" fill="url(#pGingham)"/><path d="M-170,56 H170" ${st(3.5)}/>`;
    const bowlBack = `<ellipse cx="2" cy="40" rx="32" ry="8.5" fill="#FFF1D2" ${st(3)}/>` +
      [[-14, 40], [-4, 37], [8, 41], [18, 38], [-2, 43]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="#F2B84B" ${st(1.5)}/>`).join('');
    const bowlFront = `<path d="M-30,40 Q-29,60 2,61.5 Q33,60 34,40 Q2,57 -30,40 Z" fill="#5BB8F5" ${st(3.5)}/>` +
      `<path d="M-19,50 Q2,57 23,50" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".75"/>`;
    const steam = [-12, 2, 16].map((x, i) => `<path class="a-steam s${i}" d="M${x},30 q-5,-7 0,-14 q5,-7 0,-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`).join('');
    const spoon = `<path d="M27,16 L7,6" stroke="${INK}" stroke-width="7.5" stroke-linecap="round"/><path d="M27,16 L7,6" stroke="#D5DEEA" stroke-width="3.6" stroke-linecap="round"/>` +
      `<ellipse cx="3" cy="4" rx="7" ry="4.2" transform="rotate(26 3 4)" fill="#D5DEEA" ${st(2.6)}/>` +
      `<circle class="a-food" cx="2" cy="2" r="3.8" fill="#F2B84B" ${st(1.6)}/>`;
    const armR = `<g class="a-spoon">${limb('M38,22 Q32,20 21,13')}${patch(38, 22)}${spoon}${hand(21, 13)}</g>`;
    const armL = `${limb('M-38,22 Q-42,34 -31,41')}${patch(-38, 22)}${hand(-31, 41)}`;
    const inner = char({ back: '', mouth: 'chew', feet: false }) + table + bowlBack + steam + armR + bowlFront + armL;
    return bg + wrap(150, 160, 1.05, inner);
  };

  /* ----- Boire ----- */
  S.boire = () => {
    const bg = wall('#DDF2D0') + at(236, 92, `<rect x="-22" y="-30" width="44" height="58" rx="5" fill="#FFF8EE" ${st(3.5)}/><path d="M-12,-14 H12 M-12,-4 H12 M-12,6 H6" stroke="#C9CFDB" stroke-width="2.6" stroke-linecap="round"/>`) +
      floor(236, '#F3D6A6', 'pWood');
    const GLASS = 'M-17,10 L-14,58 Q-14,62 -10,62 H10 Q14,62 14,58 L17,10 Z';
    const liquid = `<g clip-path="url(#ppGlassClip)"><rect class="a-liquid" x="-20" y="18" width="40" height="46" fill="#FFB547"/>` +
      bubbles([[-6, 52, 2], [5, 56, 1.6], [0, 46, 1.8]], 'a-gbub') + `</g>`;
    const straw = `<path d="M5,54 L6,10 Q6,1 0,2" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>` +
      `<path d="M5,54 L6,10 Q6,1 0,2" fill="none" stroke="#FF6B6B" stroke-width="3.6" stroke-linecap="round"/>` +

<script>
/* ============================================================
   Pépin — petite musique de minuteur (composition originale)
   Synthèse Web Audio : mélodie « chiptune », basse sautillante,
   petits accords, tic-tac d'horloge et deux « boing » par boucle.
   8 mesures × 8 croches = 64 pas, jouées en boucle.
   ============================================================ */
(function (global) {
  'use strict';

  function freq(n) {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    if (!m) return 0;
    const semi = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    const midi = (parseInt(m[3], 10) + 1) * 12 + semi;
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  const _ = null;
  const MELODY = [
    'C5', _, 'E5', 'G5', _, 'E5', 'C5', _,
    'D5', _, 'F5', 'G5', _, 'F5', 'D5', _,
    'E5', _, 'G5', 'C6', _, 'G5', 'E5', _,
    'D5', 'E5', 'F5', 'D5', 'B4', _, 'G4', _,
    'A4', _, 'C5', 'F5', _, 'C5', 'A4', _,
    'G4', _, 'C5', 'E5', _, 'C5', 'G4', _,
    'F5', 'E5', 'D5', 'C5', 'B4', _, 'D5', _,
    'C5', _, 'G4', _, 'C5', _, _, _,
  ];
  // [basse temps 1, basse temps 3, accord des contretemps]
  const BARS = [
    ['C3', 'G3', ['E4', 'G4']], ['G2', 'D3', ['F4', 'B4']], ['C3', 'G3', ['E4', 'G4']], ['G2', 'D3', ['F4', 'B4']],
    ['F2', 'C3', ['F4', 'A4']], ['C3', 'G3', ['E4', 'G4']], ['G2', 'D3', ['F4', 'B4']], ['C3', 'G3', ['E4', 'C5']],
  ];
  const BOING = { 30: true, 60: true };

  function tone(ctx, dest, f, t, dur, type, gain, o) {
    o = o || {};
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    if (o.bend) { osc.frequency.setValueAtTime(f * 0.94, t); osc.frequency.exponentialRampToValueAtTime(f, t + 0.035); }
    else osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = osc;
    if (o.lp) { const flt = ctx.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = o.lp; osc.connect(flt); out = flt; }
    out.connect(g); g.connect(dest);
    osc.start(t); osc.stop(t + dur + 0.03);
  }

  /** Joue le pas i (croche) au temps t ; d = durée d'une croche en secondes. */
  function playStep(ctx, dest, i, t, d) {
    const step = i % 64; const pos = step % 8; const bar = BARS[Math.floor(step / 8)];
    const note = MELODY[step];
    if (note) tone(ctx, dest, freq(note), t, d * 0.85, 'square', 0.05, { lp: 2400, bend: true });
    if (pos === 0) tone(ctx, dest, freq(bar[0]), t, d * 1.6, 'triangle', 0.17);
    if (pos === 4) tone(ctx, dest, freq(bar[1]), t, d * 1.6, 'triangle', 0.15);
    if (pos === 2 || pos === 6) bar[2].forEach((n) => tone(ctx, dest, freq(n), t, d * 0.45, 'triangle', 0.04));
    if (pos % 2 === 0) {
      const tic = pos % 4 === 0;
      tone(ctx, dest, tic ? 1750 : 1300, t, 0.04, 'sine', 0.045, { to: tic ? 1150 : 900, attack: 0.002 });
    }
    if (BOING[step]) tone(ctx, dest, 200, t, d * 2.2, 'sine', 0.08, { to: 820, attack: 0.01 });
  }

  global.PepinMusic = { playStep, STEPS: 64, freq };
})(window);

</script>

  /* ----- accueil enfant ----- */

  }

  }
  function vHome() {

      ${teaser(kid, bal)}

  }

  /* ----- récompenses (enfant) ----- */
  function rewardCard(w, bal) {
    const ok = bal >= w.cost; const pct = Math.round((bal / Math.max(1, w.cost)) * 100);
    return `<div class="reward card ${ok ? 'is-ready' : ''}"><span class="reward-emoji" aria-hidden="true">${esc(w.emoji || '🎁')}</span>

  function vRewards() {

  }

  /* ----- déroulé d'une routine ----- */
  const runStarCount = () => { const r = S.run; return r ? balance(r.childId) + r.results.reduce((s, x) => s + ((x && x.stars) || 0), 0) : 0; };
  function pdot(r, s, i) {
    const res = r.results[i];

  }
  function vRun() {

        <ol class="run-progress" aria-label="Étapes de la routine ${esc(r.title)}">${r.steps.map((s, i) => pdot(r, s, i)).join('')}</ol>

      </header>
      <div class="run-stage"><div class="stage" id="stage" data-level="ok">

        <div class="medal stage-medal" id="medal">${P.render(step.type, step)}</div>
        <button class="stage-pause" id="pauseBadge" data-action="pause" hidden>${I.play}<span>Reprendre</span></button>
      </div></div>
      <div class="run-info"><p class="run-count">${kid && kids().length > 1 ? `${esc(kid.name)} · ` : ''}Étape ${r.idx + 1} sur ${r.steps.length}</p><h1 class="run-label">${esc(step.label)}</h1>
        <div class="run-meter"><span class="pot" id="pot" role="img" aria-label="3 étoiles possibles">${[0, 1, 2].map(() => `<span class="pot-star">${STAR}</span>`).join('')}</span><p class="run-time" id="runTime">${clock(step.sec)}</p></div>
        <p class="run-late-msg" id="lateMsg" aria-live="polite"></p></div>
      <div class="run-controls" id="runControls">
        <button class="btn icon-btn ctl" data-action="pause" id="pauseBtn" aria-label="Pause">${I.pause}</button>
        <button class="btn btn-primary done-btn" data-action="done" id="doneBtn">${I.check}<span>J’ai fini !</span></button>
        <button class="btn icon-btn ctl" data-action="skip" id="skipBtn" aria-label="Passer cette étape">${I.skip}</button>
      </div>
    </section>`;
  }

  function ringTick(f) {
    const a = f * 2 * Math.PI; const pt = (rad) => `${(50 + rad * Math.sin(a)).toFixed(2)},${(50 - rad * Math.cos(a)).toFixed(2)}`;
    return `<path class="ring-tick" d="M${pt(42.3)} L${pt(49.7)}"/>`;
  }
  function musicBtn() {
    const on = !!settings().music;
    return `<button class="btn icon-btn" data-action="music" id="musicBtn" aria-pressed="${on}" aria-label="${on ? 'Couper la musique' : 'Mettre la musique'}">${on ? I.music : I.musicOff}</button>`;
  }
  function updatePot(n, animate) {
    const box = $('#pot'); if (!box) return;
    box.setAttribute('aria-label', n ? `${plural(n, 'étoile')} possible${n > 1 ? 's' : ''}` : 'Plus d’étoile pour cette étape');
    box.querySelectorAll('.pot-star').forEach((el, k) => {
      const lost = k >= n; const was = el.classList.contains('is-lost');
      el.classList.toggle('is-lost', lost);
      if (lost && !was && animate) { el.classList.remove('just-lost'); void el.offsetWidth; el.classList.add('just-lost'); }
    });
  }

  let ticker = null;
  function startTicker() { stopTicker(); ticker = setInterval(tick, 250); tick(); }
  function stopTicker() { if (ticker) clearInterval(ticker); ticker = null; }
  const elapsed = (r, now = Date.now()) => ((r.pausedAt != null ? r.pausedAt : now) - r.stepStart - (r.pausedTotal || 0));
  function runMounted() {
    S.potShown = null; applyPauseUI(); startTicker();
    const cur = $(`#pdot-${S.run.idx}`);
    if (cur && cur.scrollIntoView) try { cur.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) { /* ancien navigateur */ }
  }
  function tick() {
    const r = S.run; if (!r || S.view !== 'run') { stopTicker(); return; }
    const step = r.steps[r.idx]; const stage = $('#stage'); if (!step || !stage) return;
    const now = Date.now(); const el = elapsed(r, now); const dur = Math.max(1, +step.sec || 1) * 1000; const rem = dur - el;
    const frac = Math.min(1, Math.max(0, el / dur));
    $('#ringBar').style.strokeDashoffset = String(-frac * 100);
    $('#ringDot').style.transform = `rotate(${frac * 360}deg)`;
    const level = rem <= 0 ? 'late' : frac <= ZONES[0] ? 'ok' : frac <= ZONES[1] ? 'mid' : 'low';
    const pot = S.busy ? S.potShown : starsFor(el, dur);
    if (pot !== S.potShown) { updatePot(pot, S.potShown != null && pot < S.potShown); S.potShown = pot; }
    Music.speed = rem <= 0 ? 2 : frac > ZONES[1] ? 1 : 0;
    if (stage.dataset.level !== level) stage.dataset.level = level;
    const t = $('#runTime');
    const txt = rem > 0 ? clock(Math.ceil(rem / 1000)) : `+${clock(Math.floor(-rem / 1000))}`;
    if (t.textContent !== txt) t.textContent = txt;
    t.classList.toggle('is-late', rem <= 0);
    const msg = $('#lateMsg'); const m = rem <= 0 && !S.busy ? 'Le temps est passé, termine vite !' : '';
    if (msg && msg.textContent !== m) msg.textContent = m;
    if (r.pausedAt == null && !S.busy) {
      if (!r.warned && dur >= 180000 && rem <= 60000 && rem > 0) { r.warned = true; Voice.say('Encore une minute !'); }
      if (!r.late && rem <= 0) { r.late = true; Music.duck(true); Sound.play('timeup'); Voice.say('Le temps est écoulé. Termine vite !'); setTimeout(() => Music.duck(false), 2600); saveRun(); }
    }
    r.seen = now;
    if (now - (S.savedAt || 0) > 4000) saveRun();
  }
  function applyPauseUI() {
    const r = S.run; const p = !!(r && r.pausedAt != null);
    const medal = $('#medal'); if (medal) medal.classList.toggle('is-paused', p);
    const badge = $('#pauseBadge'); if (badge) badge.hidden = !p;
    const btn = $('#pauseBtn'); if (btn) { btn.innerHTML = p ? I.play : I.pause; btn.setAttribute('aria-label', p ? 'Reprendre' : 'Pause'); }
  }
  function refreshRunStars(bump) {
    const chip = $('#runStars'); if (!chip) return;
    const n = S.busy && S.shownStars != null ? S.shownStars : runStarCount(); chip.querySelector('.star-n').textContent = n; chip.setAttribute('aria-label', plural(n, 'étoile'));
    if (bump) { chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); }
  }
  function saveRun() { S.savedAt = Date.now(); if (S.run) LS.set(RUN_KEY, JSON.stringify({ ...S.run, seen: Date.now() })); }
  function loadRun() {
    try {
      const r = JSON.parse(LS.get(RUN_KEY) || 'null');
      if (!r || !Array.isArray(r.steps) || !r.steps.length || Date.now() - (r.seen || 0) > 6 * 3600e3) return null;
      if (r.pausedAt == null) r.pausedAt = r.seen || Date.now();
      return r;
    } catch (e) { return null; }
  }
  const clearRun = () => LS.del(RUN_KEY);

  function startRun(rid) {
    const r = routineById(rid); const kid = currentKid();
    if (!r || !kid || !(r.steps || []).length) return;
    Sound.unlock(); closeModal(true);
    S.run = {
      id: uid(), routineId: r.id, title: r.name, childId: kid.id,
      steps: r.steps.map((s) => ({ ...s, sec: Math.max(10, +s.sec || 60) })),
      idx: 0, stepStart: Date.now(), pausedAt: null, pausedTotal: 0, results: [], startedAt: Date.now(),
    };
    saveRun(); go('run'); Wake.on();
    Voice.say(`C’est parti ! ${S.run.steps[0].label}`);
  }
  function togglePause() {
    const r = S.run; if (!r || S.busy) return;
    if (r.pausedAt != null) { r.pausedTotal = (r.pausedTotal || 0) + (Date.now() - r.pausedAt); r.pausedAt = null; Wake.on(); }
    else r.pausedAt = Date.now();
    saveRun(); applyPauseUI(); tick(); Music.sync();
  }
  async function doneStep() {
    const r = S.run; if (!r || S.busy) return;
    S.shownStars = runStarCount();
    S.busy = true; Sound.unlock(); Music.sync();
    if (r.pausedAt != null) { r.pausedTotal = (r.pausedTotal || 0) + (Date.now() - r.pausedAt); r.pausedAt = null; applyPauseUI(); }
    const step = r.steps[r.idx]; const el = elapsed(r); const onTime = el <= step.sec * 1000;
    const stars = starsFor(el, step.sec * 1000);
    r.results[r.idx] = { status: 'done', onTime, stars };
    saveRun();
    ['doneBtn', 'pauseBtn', 'skipBtn'].forEach((id) => { const b = $(`#${id}`); if (b) b.disabled = true; });
    const medal = $('#medal');
    if (medal) { medal.innerHTML = P.render('bravo'); medal.classList.remove('pop-in'); void medal.offsetWidth; medal.classList.add('pop-in'); }
    const dot = $(`#pdot-${r.idx}`); if (dot) dot.outerHTML = pdot(r, step, r.idx);
    const lm = $('#lateMsg'); if (lm) lm.textContent = '';
    updatePot(stars, false);
    if (stars) {
      Sound.play('star');
      Voice.say({ 3: `${pick(['Super rapide !', 'Waouh, trop fort !', 'Génial !'])} Trois étoiles !`, 2: `${pick(['Bravo !', 'Super !'])} Deux étoiles !`, 1: `${pick(['Bien joué !', 'C’est fait !'])} Une étoile !` }[stars]);
      for (let k = 0; k < stars; k++) {
        setTimeout(() => flyStar(medal, () => { S.shownStars = (S.shownStars || 0) + 1; refreshRunStars(true); Sound.play('ding', k); }, (k - (stars - 1) / 2) * 46), k * 280);
      }
    } else {
      Sound.play('done'); Voice.say('C’est fait, bien joué !');
    }

    if (S.run === r) nextStep();
  }
  function skipStep() {
    const r = S.run; if (!r || S.busy) return;
    r.results[r.idx] = { status: 'skip', onTime: false, stars: 0 };
    nextStep();
  }
  function nextStep() {
    const r = S.run; if (!r) return;
    if (r.idx + 1 >= r.steps.length) { finishRun(false); return; }
    r.idx += 1; r.stepStart = Date.now(); r.pausedAt = null; r.pausedTotal = 0; r.warned = false; r.late = false;
    saveRun(); render();
    const medal = $('#medal'); if (medal) medal.classList.add('pop-in');
    Voice.say(`Maintenant : ${r.steps[r.idx].label}`);
  }
  async function quitRun() {
    const r = S.run; if (!r || S.busy) return;
    const wasRunning = r.pausedAt == null;
    if (wasRunning) { r.pausedAt = Date.now(); applyPauseUI(); Music.sync(); }
    const doneCount = r.results.filter((x) => x && x.status === 'done').length;
    const ok = await confirmBox({ title: 'Arrêter la routine ?', text: doneCount ? 'Les étoiles déjà gagnées sont gardées.' : 'Tu pourras la recommencer plus tard.', ok: 'Arrêter', danger: true });
    if (ok) finishRun(true);
    else if (wasRunning && S.run === r) togglePause();
  }
  function finishRun(partial) {
    const r = S.run; if (!r) return;
    const res = r.results.filter(Boolean);
    const earned = res.reduce((s, x) => s + (x.stars || 0), 0);
    const doneCount = res.filter((x) => x.status === 'done').length;
    const perfect = !partial && doneCount === r.steps.length && res.every((x) => x.status === 'done' && x.onTime);
    const bonus = perfect && settings().bonus ? 2 : 0;
    const total = earned + bonus;
    const before = balance(r.childId);
    S.run = null; clearRun(); Wake.off(); stopTicker();
    if (doneCount > 0) {
      put('log', uid(), { child: r.childId, kind: 'routine', routine: r.routineId, title: r.title, stars: total, done: doneCount, steps: r.steps.length, onTime: res.filter((x) => x.status === 'done' && x.onTime).length, bonus, partial: !!partial, at: Date.now() });
    }
    if (partial && doneCount === 0) { go(currentKid() ? 'home' : 'welcome'); return; }
    S.end = { childId: r.childId, title: r.title, earned, bonus, total, partial: !!partial, doneCount, steps: r.steps.length, before,
      items: r.steps.map((s, i) => ({ type: s.type, label: s.label, emoji: s.emoji, res: r.results[i] || null })) };

    if (partial) Voice.say(`D’accord ${name}. Tu as fait ${plural(doneCount, 'étape')}.`);
    else if (total > 0) Voice.say(`Bravo ${name} ! Tu as gagné ${plural(total, 'étoile')} !`);

  }
  function flyStar(fromEl, done, dx = 0) {

    if (!target || !fromEl || reduceMotion() || !document.body.animate) { done(); return; }
    const a = fromEl.getBoundingClientRect(); const b = target.getBoundingClientRect();
    const el = document.createElement('div'); el.className = 'fly-star'; el.innerHTML = STAR; document.body.appendChild(el);
    const x0 = a.left + a.width / 2 - 45 + dx; const y0 = a.top + a.height / 2 - 45;
    const x1 = b.left + 20 - 45; const y1 = b.top + b.height / 2 - 45;
    const anim = el.animate([
      { transform: `translate(${x0}px, ${y0}px) scale(.2) rotate(-40deg)`, opacity: 0 },
      { transform: `translate(${x0}px, ${y0 - 24}px) scale(1.5) rotate(0deg)`, opacity: 1, offset: 0.32 },
      { transform: `translate(${x0}px, ${y0 - 24}px) scale(1.35) rotate(12deg)`, opacity: 1, offset: 0.55 },
      { transform: `translate(${x1}px, ${y1}px) scale(.3) rotate(220deg)`, opacity: 1 },

  /* ----- fin de routine ----- */
  function vEnd() {

    const kid = kidById(e.childId) || currentKid(); const name = kid ? esc(kid.name) : '';
    const items = (e.items || []).map((it, i) => {
      const ok = !!(it.res && it.res.status === 'done'); const n = ok ? (it.res.stars || 0) : 0;
      return `<li class="end-step ${ok ? '' : 'is-skip'}" style="--i:${i}" aria-label="${esc(it.label)} : ${ok ? plural(n, 'étoile') : 'pas faite'}"><span class="thumb is-still">${P.render(it.type, it)}</span><span class="end-step-stars" aria-hidden="true">${[0, 1, 2].map((k) => `<span class="mini ${k < n ? 'on' : ''}">${STAR}</span>`).join('')}</span></li>`;
    }).join('');
    const now = e.before + e.total;
    const next = rewardsList().find((w) => w.cost > now);

      ${e.total ? `<p class="end-earned" role="img" aria-label="${plural(e.total, 'étoile')} gagnée${e.total > 1 ? 's' : ''}">${STAR}<span>+${e.total}</span></p>` : ''}

      <div class="end-actions"><button class="btn btn-primary btn-big" data-action="home">${I.check} Terminé</button><button class="btn btn-big" data-action="rewards">${I.gift} Mes récompenses</button></div>

    return '<div class="card info-card"><h3>Comment gagner des étoiles</h3><p>Étape finie dans les premiers 30 % du temps : 3 étoiles. Jusqu’à 60 % du temps : 2 étoiles. Avant la fin du minuteur : 1 étoile. L’anneau change de couleur à chaque palier.</p></div>' +

  /* ----- éditeur de routine ----- */
  function stepRow(s, i, n) {
    const a = ACT[s.type] || ACT.autre; const sid = esc(s.id);
    const durs = DURS.includes(+s.sec) ? DURS : [...DURS, +s.sec].sort((x, y) => x - y);
    return `<li class="step-row card">
      <button class="step-thumb is-still" data-action="s-type" data-i="${i}" aria-label="Animation : ${esc(a.name)}. Changer l’animation">${P.render(s.type, s)}<span class="step-thumb-edit">${I.edit}</span></button>
      <div class="step-fields">
        <label class="sr-only" for="s-label-${sid}">Nom de l’étape ${i + 1}</label>
        <input id="s-label-${sid}" class="step-input" data-change="s-label" data-i="${i}" value="${esc(s.label)}" maxlength="40" autocomplete="off">
        <div class="step-sub">
          <label class="sr-only" for="s-dur-${sid}">Durée de l’étape ${i + 1}</label>
          <select id="s-dur-${sid}" data-change="s-dur" data-i="${i}">${durs.map((d) => `<option value="${d}" ${d === +s.sec ? 'selected' : ''}>${fmtDur(d)}</option>`).join('')}</select>
          ${s.type === 'autre' ? `<input class="emoji-input" id="s-emoji-${sid}" data-change="s-emoji" data-i="${i}" value="${esc(s.emoji || '⭐')}" maxlength="8" aria-label="Emoji de l’étape ${i + 1}" autocomplete="off">` : `<span class="step-kind">${esc(a.name)}</span>`}
        </div>
      </div>
      <div class="step-tools">
        <button class="btn btn-xs icon-btn" data-action="s-up" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Monter l’étape ${i + 1}">${I.up}</button>
        <button class="btn btn-xs icon-btn" data-action="s-down" data-i="${i}" ${i === n - 1 ? 'disabled' : ''} aria-label="Descendre l’étape ${i + 1}">${I.down}</button>
        <button class="btn btn-xs icon-btn btn-danger" data-action="s-del" data-i="${i}" aria-label="Supprimer l’étape ${i + 1}">${I.trash}</button>
      </div></li>`;
  }
  function whoPicker(r) {
    const ks = kids(); if (ks.length < 2) return '';
    return `<p class="label" id="r-kids-l">Pour qui ?</p><div class="who" role="group" aria-labelledby="r-kids-l">${ks.map((k) => {
      const on = visibleFor(r, k.id);

    }).join('')}</div>`;

  function vEditor() {
    const r = routineById(S.editId); if (!r) { S.view = 'parents'; return vParents(); }
    const steps = r.steps || []; const kid = currentKid();
    return `<section class="view editor" style="${colorVars(kid && kid.color)}">
      <header class="topbar"><button class="btn icon-btn" data-action="tab" data-tab="routines" aria-label="Retour aux routines">${I.back}</button><h1 class="title">${esc(r.name)}</h1><button class="btn btn-sm btn-primary" data-action="try" data-id="${esc(r.id)}" ${steps.length ? '' : 'disabled'}>${I.play} Essayer</button></header>
      <div class="card form-card">
        <label for="r-name">Nom de la routine</label>
        <input id="r-name" class="field" data-change="r-name" value="${esc(r.name)}" maxlength="30" autocomplete="off">

        <div class="icon-pick" role="radiogroup" aria-labelledby="r-icon-l">${Object.keys(RI).map((k) => `<button class="icon-opt ${r.icon === k ? 'is-on' : ''}" role="radio" aria-checked="${r.icon === k}" aria-label="${RI_NAMES[k]}" data-action="r-icon" data-icon="${k}">${RI[k]}</button>`).join('')}</div>
        ${whoPicker(r)}
      </div>
      <h2 class="section-title">Étapes <span class="muted">${steps.length ? `${steps.length} · ${fmtDur(totalSec(r))} en tout` : 'aucune pour l’instant'}</span></h2>
      ${steps.length ? `<ol class="step-list">${steps.map((s, i) => stepRow(s, i, steps.length)).join('')}</ol>` : ''}
      <button class="btn btn-add" data-action="s-add">${I.plus} Ajouter une étape</button>
